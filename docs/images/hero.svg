<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. A YAML glossary, rich entries, deprecated terms, and a configuration file of table
       jobs flow into the dictionarymark tool and come out as a Markdown table with sized columns, a bullet list, a
       deprecated-terms table, and Pandoc documents.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
      /* DictionaryMark: YAML snippets in the input cards, and Markdown tables and lists in the output cards */
      .code { font: 22px monospace; fill: #e2e8f0; }
      .key { fill: #7dd3fc; }
      .punct { fill: #94a3b8; }
      .str { fill: #f9a8d4; }
      .th { font: bold 22px sans-serif; fill: #e0e7ff; }
      .tt { font: bold 22px sans-serif; fill: #f1f5f9; }
      .td { font: 22px sans-serif; fill: #cbd5e1; }
      .old { font: 22px sans-serif; fill: #fda4af; }
      .new { font: 22px sans-serif; fill: #5eead4; }
      .dim { font: bold 22px sans-serif; text-anchor: middle; }
      .chip { font: bold 22px sans-serif; fill: #ffffff; text-anchor: middle; }
      .grid { fill: none; stroke: #475569; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <!-- DictionaryMark: "Dictionary" = 4890 units and "Mark" = 2334 units (7224 in all), so the name is drawn at
       70px instead of 92px to end before x = 560 (at 557.7): x = 52 + 0.070 * 4890 = 394.3. -->
  <text class="word" x="52" y="176" style="font-size: 70px">Dictionary</text>
  <text class="word brandText" x="394.3" y="176" style="font-size: 70px">Mark</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">YAML dictionaries in.</text>
  <text class="tag brandText" x="56" y="316">Markdown glossaries out.</text>
  <text class="body" x="58" y="368">One .NET tool turns YAML term dictionaries</text>
  <text class="body" x="58" y="402">into Markdown tables and bullet lists,</text>
  <text class="body" x="58" y="436">for documents, docs pipelines and CI.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">dictionarymark --config</text>
  <text class="cmd file" x="138" y="539">dictionarymark.yaml</text>
  <text class="note" x="58" y="604">One config file, one run, every table.</text>


  <!-- Input cards -->
  <!-- DictionaryMark: the widths are rebalanced to 206, 242, 284, and 212 so that each YAML snippet fits at 22px
       (centers 683, 919, 1194, and 1454). -->
  <g>
    <!-- Input one: a YAML glossary of terms and definitions -->
    <rect class="card" x="580" y="40" width="206" height="160" rx="16"/>
    <rect x="627" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="190" height="112" rx="10"/>
    <text class="code" x="600" y="82"><tspan class="key">API</tspan><tspan class="punct">:</tspan> Applic…</text>
    <text class="code" x="600" y="110"><tspan class="key">CLI</tspan><tspan class="punct">:</tspan> Comma…</text>
    <text class="code" x="600" y="138"><tspan class="key">SDK</tspan><tspan class="punct">:</tspan> Softw…</text>
    <text class="label" x="683" y="190">Glossary</text>

    <!-- Input two: a rich entry with a definition, a part of speech, and variants -->
    <rect class="card" x="798" y="40" width="242" height="160" rx="16"/>
    <rect x="863" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="806" y="48" width="226" height="112" rx="10"/>
    <text class="code" x="818" y="74"><tspan class="key">bleed valve</tspan><tspan class="punct">:</tspan></text>
    <text class="code" x="844.4" y="98"><tspan class="key">definition</tspan><tspan class="punct">:</tspan> …</text>
    <text class="code" x="844.4" y="122"><tspan class="key">pos</tspan><tspan class="punct">:</tspan> noun</text>
    <text class="code" x="844.4" y="146"><tspan class="key">variants</tspan><tspan class="punct">: [</tspan>…<tspan class="punct">]</tspan></text>
    <text class="label" x="919" y="190">Rich entries</text>

    <!-- Input three: a deprecated term with the term to use instead and where -->
    <rect class="card" x="1052" y="40" width="284" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1060" y="48" width="268" height="112" rx="10"/>
    <text class="code" x="1072" y="82"><tspan class="key">bench mode</tspan><tspan class="punct">:</tspan></text>
    <text class="code" x="1098.4" y="110"><tspan class="key">use</tspan><tspan class="punct">:</tspan> Test Mode</text>
    <text class="code" x="1098.4" y="138"><tspan class="key">where</tspan><tspan class="punct">:</tspan> Product A</text>
    <text class="label" x="1194" y="190">Deprecated</text>

    <!-- Input four: the configuration file with the format defaults and the table jobs -->
    <rect class="card" x="1348" y="40" width="212" height="160" rx="16"/>
    <rect x="1398" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1356" y="48" width="196" height="112" rx="10"/>
    <text class="code" x="1366" y="74"><tspan class="key">format</tspan><tspan class="punct">:</tspan> table</text>
    <text class="code" x="1366" y="98"><tspan class="key">tables</tspan><tspan class="punct">:</tspan></text>
    <text class="code" x="1392.4" y="122"><tspan class="punct">- </tspan><tspan class="key">input</tspan><tspan class="punct">:</tspan> <tspan class="str">…</tspan></text>
    <text class="code" x="1418.8" y="146"><tspan class="key">output</tspan><tspan class="punct">:</tspan> <tspan class="str">…</tspan></text>
    <text class="label" x="1454" y="190">Config file</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M683,206 C683,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M919,206 C919,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1454,206 C1454,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="683" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="919" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1454" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine -->
  <!-- DictionaryMark: "dictionarymark" is 14 characters, so the pill is 512px wide (x = 814), the name starts at
       x = 890, the divider is at x = 1171, and the label starts at x = 1191. The glyph is a bullet list. -->
  <rect x="814" y="262" width="512" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="814" y="262" width="512" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="838" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <g fill="#ffffff">
    <circle cx="846" cy="286" r="2.5"/>
    <rect x="851" y="284" width="15" height="4" rx="2"/>
    <circle cx="846" cy="294" r="2.5"/>
    <rect x="851" y="292" width="11" height="4" rx="2"/>
    <circle cx="846" cy="302" r="2.5"/>
    <rect x="851" y="300" width="15" height="4" rx="2"/>
  </g>
  <text class="engine" x="890" y="305">dictionarymark</text>
  <line x1="1171" y1="278" x2="1171" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1191" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: a Markdown table with sized columns (column widths 25,75) -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <text class="dim" x="632" y="426" fill="#22d3ee">25</text>
    <text class="dim" x="760" y="426" fill="#f472b6">75</text>
    <g stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M601,432 V442 M601,437 H662 M662,432 V442" stroke="#22d3ee"/>
      <path d="M666,432 V442 M666,437 H855 M855,432 V442" stroke="#f472b6"/>
    </g>
    <rect x="600" y="448" width="256" height="30" fill="#312e81"/>
    <rect class="grid" x="600" y="448" width="256" height="90"/>
    <path class="grid" d="M664,448 V538 M600,478 H856 M600,508 H856"/>
    <text class="th" x="607" y="471">Term</text>
    <text class="th" x="671" y="471">Definition</text>
    <text class="tt" x="607" y="501">API</text>
    <text class="td" x="671" y="501">Application…</text>
    <text class="tt" x="607" y="531">CLI</text>
    <text class="td" x="671" y="531">Command-line…</text>
    <text class="label" x="728" y="585">Sized table</text>

    <!-- Output two: a Markdown bullet list -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <text class="tt" x="911" y="432">Glossary</text>
    <g fill="#22d3ee">
      <circle cx="916" cy="460" r="4"/>
      <circle cx="916" cy="492" r="4"/>
      <circle cx="916" cy="524" r="4"/>
    </g>
    <text class="tt" x="928" y="468">API</text>
    <text class="td" x="964.7" y="468">: Applic…</text>
    <text class="tt" x="928" y="500">CLI</text>
    <text class="td" x="963.4" y="500">: Comma…</text>
    <text class="tt" x="928" y="532">SDK</text>
    <text class="td" x="974.4" y="532">: Softw…</text>
    <text class="label" x="999" y="585">Bullet list</text>

    <!-- Output three: a deprecated-terms table (not used, use instead, where) -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <rect x="1140" y="408" width="184" height="30" fill="#312e81"/>
    <rect class="grid" x="1140" y="408" width="184" height="132"/>
    <path class="grid" d="M1140,438 H1324 M1140,472 H1324 M1140,506 H1324"/>
    <text class="th" x="1148" y="431">Deprecated</text>
    <text class="old" x="1148" y="463">bench mode</text>
    <path d="M1149,490 H1163 M1157,484 L1164,490 L1157,496" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="new" x="1174" y="497">Test Mode</text>
    <text class="td" x="1148" y="531">in Product A</text>
    <text class="label" x="1232" y="585">Deprecated table</text>

    <!-- Output four: Pandoc documents in PDF and HTML that include the generated Markdown -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <path class="page" d="M1377 408 L1449 408 L1465 424 L1465 542 L1377 542 Z"/>
    <path d="M1449 408 L1449 424 L1465 424 Z" fill="#cbd5e1"/>
    <rect x="1387" y="420" width="44" height="8" rx="4" fill="#4f46e5"/>
    <rect class="bar" x="1387" y="436" width="56" height="5" rx="2.5"/>
    <rect class="bar" x="1387" y="446" width="46" height="5" rx="2.5"/>
    <rect x="1387" y="458" width="68" height="9" fill="#c7d2fe"/>
    <rect x="1387" y="458" width="68" height="45" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <path d="M1404,458 V503 M1387,467 H1455 M1387,479 H1455 M1387,491 H1455" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <rect class="bar" x="1387" y="512" width="56" height="5" rx="2.5"/>
    <rect class="bar" x="1387" y="522" width="40" height="5" rx="2.5"/>
    <rect x="1472" y="440" width="72" height="32" rx="7" fill="#dc2626"/>
    <text class="chip" x="1508" y="464">PDF</text>
    <rect x="1472" y="486" width="72" height="32" rx="7" fill="#ea580c"/>
    <text class="chip" x="1508" y="510">HTML</text>
    <text class="label" x="1457" y="585">Pandoc docs</text>
  </g>
</svg>
