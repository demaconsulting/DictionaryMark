<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. YAML glossaries, rich entries, deprecated terms, and a configuration file of table jobs
       flow into the dictionarymark tool, and come out as a Markdown table with sized columns, a bullet list, a
       deprecated-terms table, and Pandoc documents. -->
  <defs>
    <style>
      /* DEMA hero template: the classes of the top-left block, copied from the CanvasNet hero */
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      /* DictionaryMark: the product name and command are longer than CanvasNet's, so only their sizes change */
      .word { font-size: 76px; }
      .cmd { font-size: 19px; }

      /* The flow on the right */
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
      .code { font: 17px monospace; fill: #e2e8f0; }
      .key { fill: #7dd3fc; }
      .punct { fill: #94a3b8; }
      .str { fill: #f9a8d4; }
      .head { font: bold 16px sans-serif; fill: #ffffff; }
      .th { font: bold 14px sans-serif; fill: #e0e7ff; }
      .td { font: 14px sans-serif; fill: #cbd5e1; }
      .tt { font: bold 14px sans-serif; fill: #f1f5f9; }
      .old { font: 14px sans-serif; fill: #fda4af; }
      .new { font: 14px sans-serif; fill: #5eead4; }
      .li { font: 15px sans-serif; fill: #cbd5e1; }
      .lb { font: bold 15px sans-serif; fill: #ffffff; }
      .dim { font: bold 14px sans-serif; text-anchor: middle; }
      .grid { fill: none; stroke: #475569; stroke-width: 1; }
      .chip { font: bold 13px sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <!-- DEMA hero template: the brand gradient of the product name, the underline bar, and the tagline -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1105" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- DEMA hero template (top-left block), copied from the CanvasNet hero. To reuse it in another DEMA
       repository, copy the template classes in the style element, the brand gradient, the background, and the
       groups dema-brand, product-title, and product-pitch, with dc-logo-dark.svg beside the SVG file. Keep
       dema-brand as it is. In product-title change only the two words of the name, the .word font size (92px
       when the name fits), and the x of the gradient word: 52 plus the width of the white word. -->
  <g id="dema-brand">
    <image href="dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
    <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  </g>
  <g id="product-title">
    <text class="word" x="52" y="176">Dictionary</text>
    <text class="word brandText" x="423.6" y="176">Mark</text>
    <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  </g>
  <g id="product-pitch">
    <text class="tag" x="56" y="266">YAML dictionaries in.</text>
    <text class="tag brandText" x="56" y="316">Markdown glossaries out.</text>
    <text class="body" x="58" y="368">One .NET tool turns YAML term dictionaries</text>
    <text class="body" x="58" y="402">into Markdown tables and bullet lists, for</text>
    <text class="body" x="58" y="436">documents, docs pipelines and CI.</text>
    <rect x="56" y="468" width="557" height="54" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text class="cmd prompt" x="78" y="501">$</text>
    <text class="cmd" x="100.8" y="501">dictionarymark --config</text>
    <text class="cmd file" x="374.4" y="501">dictionarymark.yaml</text>
    <text class="note" x="58" y="568">One config file, one run, every table.</text>
  </g>

  <!-- Input cards: YAML snippets of each kind of input -->
  <g>
    <rect class="card" x="650" y="40" width="217" height="160" rx="16"/>
    <rect x="702.5" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="658" y="48" width="201" height="112" rx="10"/>
    <text class="code key" x="668" y="80">API</text>
    <text class="code punct" x="698.6" y="80">:</text>
    <text class="code" x="719" y="80">Application…</text>
    <text class="code key" x="668" y="106">CLI</text>
    <text class="code punct" x="698.6" y="106">:</text>
    <text class="code" x="719" y="106">Command…</text>
    <text class="code key" x="668" y="132">SDK</text>
    <text class="code punct" x="698.6" y="132">:</text>
    <text class="code" x="719" y="132">Software…</text>
    <text class="label" x="758.5" y="190">Glossary</text>

    <rect class="card" x="881" y="40" width="217" height="160" rx="16"/>
    <rect x="933.5" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="889" y="48" width="201" height="112" rx="10"/>
    <text class="code key" x="899" y="74">bleed valve</text>
    <text class="code punct" x="1011.2" y="74">:</text>
    <text class="code key" x="919.4" y="97">definition</text>
    <text class="code punct" x="1021.4" y="97">:</text>
    <text class="code" x="1041.8" y="97">…</text>
    <text class="code key" x="919.4" y="120">pos</text>
    <text class="code punct" x="950" y="120">:</text>
    <text class="code" x="970.4" y="120">noun</text>
    <text class="code key" x="919.4" y="143">variants</text>
    <text class="code punct" x="1001" y="143">: [</text>
    <text class="code" x="1031.6" y="143">…</text>
    <text class="code punct" x="1041.8" y="143">]</text>
    <text class="label" x="989.5" y="190">Rich entries</text>

    <rect class="card" x="1112" y="40" width="217" height="160" rx="16"/>
    <rect x="1164.5" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="1120" y="48" width="201" height="112" rx="10"/>
    <text class="code key" x="1128" y="80">bench mode</text>
    <text class="code punct" x="1230" y="80">:</text>
    <text class="code key" x="1148.4" y="106">use</text>
    <text class="code punct" x="1179" y="106">:</text>
    <text class="code" x="1199.4" y="106">Test Mode</text>
    <text class="code key" x="1148.4" y="132">where</text>
    <text class="code punct" x="1199.4" y="132">:</text>
    <text class="code" x="1219.8" y="132">Product A</text>
    <text class="label" x="1220.5" y="190">Deprecated</text>

    <rect class="card" x="1343" y="40" width="217" height="160" rx="16"/>
    <rect x="1395.5" y="40" width="112" height="3" rx="1.5" fill="#a78bfa"/>
    <rect class="panel" x="1351" y="48" width="201" height="112" rx="10"/>
    <text class="code key" x="1361" y="74">format</text>
    <text class="code punct" x="1422.2" y="74">:</text>
    <text class="code" x="1442.6" y="74">table</text>
    <text class="code key" x="1361" y="97">tables</text>
    <text class="code punct" x="1422.2" y="97">:</text>
    <text class="code punct" x="1381.4" y="120">-</text>
    <text class="code key" x="1401.8" y="120">input</text>
    <text class="code punct" x="1452.8" y="120">:</text>
    <text class="code str" x="1473.2" y="120">…</text>
    <text class="code key" x="1401.8" y="143">output</text>
    <text class="code punct" x="1463" y="143">:</text>
    <text class="code str" x="1483.4" y="143">…</text>
    <text class="label" x="1451.5" y="190">Config file</text>
  </g>

  <!-- Flows into the tool -->
  <g class="flow">
    <path d="M758.5,206 C758.5,236 965,226 965,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M989.5,206 C989.5,236 1065,226 1065,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M1220.5,206 C1220.5,236 1145,226 1145,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1451.5,206 C1451.5,236 1245,226 1245,253" stroke="#a78bfa" marker-end="url(#headViolet)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="758.5" cy="206" r="5" fill="#f472b6"/>
    <circle cx="989.5" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="1220.5" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1451.5" cy="206" r="5" fill="#a78bfa"/>
  </g>

  <!-- The tool -->
  <rect x="843" y="262" width="524" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="843" y="262" width="524" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="867" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <g fill="#ffffff">
    <circle cx="875" cy="286" r="2.5"/>
    <rect x="880" y="284" width="15" height="4" rx="2"/>
    <circle cx="875" cy="294" r="2.5"/>
    <rect x="880" y="292" width="11" height="4" rx="2"/>
    <circle cx="875" cy="302" r="2.5"/>
    <rect x="880" y="300" width="15" height="4" rx="2"/>
  </g>
  <text class="engine" x="919" y="305">dictionarymark</text>
  <line x1="1208" y1="278" x2="1208" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1228" y="303">.NET tool</text>

  <!-- Flows out of the tool -->
  <g class="flow" stroke="#5eead4">
    <path d="M1005,330 C1005,356 755,356 755,381" marker-end="url(#headMint)"/>
    <path d="M1075,330 C1075,356 966,356 966,381" marker-end="url(#headMint)"/>
    <path d="M1135,330 C1135,356 1217,356 1217,381" marker-end="url(#headMint)"/>
    <path d="M1205,330 C1205,356 1468,356 1468,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="1005" cy="330" r="5"/>
    <circle cx="1075" cy="330" r="5"/>
    <circle cx="1135" cy="330" r="5"/>
    <circle cx="1205" cy="330" r="5"/>
  </g>

  <!-- Output cards: the Markdown that dictionarymark writes, and the documents that use it -->
  <g>
    <!-- A table with sized columns (column widths 25,75) -->
    <rect class="card" x="650" y="390" width="210" height="210" rx="16"/>
    <rect class="panel" x="658" y="398" width="194" height="152" rx="10"/>
    <g stroke-width="2" stroke-linecap="round">
      <path d="M667,409 V417 M667,413 H709 M709,409 V417" stroke="#22d3ee" fill="none"/>
      <path d="M713,409 V417 M713,413 H845 M845,409 V417" stroke="#f472b6" fill="none"/>
    </g>
    <text class="dim" x="688" y="434" fill="#22d3ee">25</text>
    <text class="dim" x="779" y="434" fill="#f472b6">75</text>
    <rect x="666" y="442" width="180" height="24" fill="#312e81"/>
    <rect class="grid" x="666" y="442" width="180" height="96"/>
    <path class="grid" d="M711,442 V538 M666,466 H846 M666,490 H846 M666,514 H846"/>
    <text class="th" x="672" y="459">Term</text>
    <text class="th" x="717" y="459">Definition</text>
    <text class="tt" x="672" y="483">API</text>
    <text class="td" x="717" y="483">Application Prog…</text>
    <text class="tt" x="672" y="507">CLI</text>
    <text class="td" x="717" y="507">Command-line…</text>
    <text class="tt" x="672" y="531">SDK</text>
    <text class="td" x="717" y="531">Software Devel…</text>
    <text class="label" x="755" y="585">Sized table</text>

    <!-- A bullet list -->
    <rect class="card" x="874" y="390" width="184" height="210" rx="16"/>
    <rect class="panel" x="882" y="398" width="168" height="152" rx="10"/>
    <text class="head" x="894" y="430">Glossary</text>
    <g fill="#22d3ee">
      <circle cx="898" cy="459" r="3.5"/>
      <circle cx="898" cy="489" r="3.5"/>
      <circle cx="898" cy="519" r="3.5"/>
    </g>
    <text class="lb" x="908" y="464">API</text>
    <text class="li" x="933" y="464">: Application…</text>
    <text class="lb" x="908" y="494">CLI</text>
    <text class="li" x="932.2" y="494">: Command…</text>
    <text class="lb" x="908" y="524">SDK</text>
    <text class="li" x="939.7" y="524">: Software…</text>
    <text class="label" x="966" y="585">Bullet list</text>

    <!-- A deprecated-terms table -->
    <rect class="card" x="1072" y="390" width="290" height="210" rx="16"/>
    <rect class="panel" x="1080" y="398" width="274" height="152" rx="10"/>
    <text class="head" x="1090" y="430">Deprecated Terms</text>
    <rect x="1090" y="446" width="254" height="26" fill="#312e81"/>
    <rect class="grid" x="1090" y="446" width="254" height="78"/>
    <path class="grid" d="M1180,446 V524 M1268,446 V524 M1090,472 H1344 M1090,498 H1344"/>
    <text class="th" x="1097" y="464">Not used</text>
    <text class="th" x="1187" y="464">Use instead</text>
    <text class="th" x="1275" y="464">Where</text>
    <text class="old" x="1097" y="490">bench mode</text>
    <text class="new" x="1187" y="490">Test Mode</text>
    <text class="td" x="1275" y="490">Product A</text>
    <text class="old" x="1097" y="516">Zorbix unit</text>
    <text class="new" x="1187" y="516">Zorbix</text>
    <text class="label" x="1217" y="585">Deprecated table</text>

    <!-- Pandoc documents: PDF and HTML -->
    <rect class="card" x="1376" y="390" width="184" height="210" rx="16"/>
    <rect class="panel" x="1384" y="398" width="168" height="152" rx="10"/>
    <path class="page" d="M1400 408 L1484 408 L1500 424 L1500 542 L1400 542 Z"/>
    <path d="M1484 408 L1484 424 L1500 424 Z" fill="#cbd5e1"/>
    <rect x="1410" y="420" width="50" height="8" rx="4" fill="#4f46e5"/>
    <rect x="1410" y="436" width="72" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="1410" y="446" width="60" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="1410" y="458" width="80" height="9" fill="#c7d2fe"/>
    <rect x="1410" y="458" width="80" height="45" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <path d="M1430,458 V503 M1410,467 H1490 M1410,479 H1490 M1410,491 H1490" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <rect x="1410" y="512" width="72" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="1410" y="522" width="52" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="1488" y="468" width="52" height="22" rx="6" fill="#dc2626"/>
    <text class="chip" x="1514" y="484">PDF</text>
    <rect x="1488" y="498" width="52" height="22" rx="6" fill="#ea580c"/>
    <text class="chip" x="1514" y="514">HTML</text>
    <text class="label" x="1468" y="585">Pandoc docs</text>
  </g>
</svg>
