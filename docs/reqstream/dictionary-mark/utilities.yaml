---
# DictionaryMark Utilities subsystem requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Utilities Requirements
        requirements:
          - id: DictionaryMark-Utilities-FileMatching
            title: The Utilities subsystem shall provide shared file-matching utilities.
            justification: |
              Shared file-matching utilities prevent duplication and ensure consistent glob
              pattern resolution across all tool subsystems.
            children:
              - DictionaryMark-GlobMatcher-GetFiles
              - DictionaryMark-GlobMatcher-NullCollectionRejection
              - DictionaryMark-GlobMatcher-InvalidPatternRejection
              - DictionaryMark-GlobMatcher-StrictResolve
              - DictionaryMark-GlobMatcher-EnvironmentVariables
            tests:
              - UtilitiesSubsystem_GlobMatcher_ResolvesFiles

          - id: DictionaryMark-Utilities-PathSafety
            title: >-
              The Utilities subsystem shall enforce path-safety to prevent path-traversal
              vulnerabilities.
            justification: |
              Path-safety enforcement in PathHelpers prevents directory-traversal attacks
              when combining base paths with caller-supplied relative paths.
            children:
              - DictionaryMark-PathHelpers-SafePathCombine
              - DictionaryMark-PathHelpers-NullValidation
              - DictionaryMark-PathHelpers-TraversalValidation
            tests:
              - UtilitiesSubsystem_PathResolutionWorkflow_ValidPaths_ResolvesCorrectly
              - UtilitiesSubsystem_PathTraversalValidation_DangerousPaths_ThrowsException
              - UtilitiesSubsystem_AbsolutePathRejection_ThrowsException
              - UtilitiesSubsystem_DirectoryCreationWorkflow_ValidPaths_CreatesDirectories

          - id: DictionaryMark-Utilities-TempDirectory
            title: >-
              The Utilities subsystem shall provide a disposable temporary directory facility
              for use by self-test and test code.
            justification: |
              A shared TemporaryDirectory utility prevents both production self-test code and
              test infrastructure from duplicating directory-lifecycle management and ensures
              consistent cleanup behavior across all consumers.
            children:
              - DictionaryMark-TemporaryDirectory-DirectoryCreation
              - DictionaryMark-TemporaryDirectory-FilePathResolution
              - DictionaryMark-TemporaryDirectory-TraversalRejection
              - DictionaryMark-TemporaryDirectory-Disposal
              - DictionaryMark-Utilities-PathSafety
            tests:
              - UtilitiesSubsystem_DirectoryCreationWorkflow_ValidPaths_CreatesDirectories

          - id: DictionaryMark-Utilities-PathResolution
            title: >-
              The Utilities subsystem shall resolve user-supplied input patterns, output paths and directories
              against a base directory, expanding ${VAR} references and supporting parent-directory segments.
            justification: |
              Paths come from the command line and from configuration files, relative to different directories;
              shared resolution ensures they behave the same everywhere.
            children:
              - DictionaryMark-PathResolver-ResolvePath
              - DictionaryMark-PathResolver-EnvironmentVariables
              - DictionaryMark-PathResolver-GlobCombine
              - DictionaryMark-PathResolver-NullValidation
              - DictionaryMark-PathResolver-ExistingDirectory
              - DictionaryMark-GlobMatcher-BaseDirectory
            tests:
              - UtilitiesSubsystem_PathResolution_ParentSegments_ResolvesFiles
              - UtilitiesSubsystem_PathResolution_RootDirectoryWithParentSegments_ResolvesFiles

          - id: DictionaryMark-Utilities-FileAccessConfinement
            title: >-
              The Utilities subsystem shall judge configuration-file paths by the never-accessed list and the
              file-access mode, using the real path of each opened file, and shall read and write such files only
              after they pass.
            justification: |
              Confinement must be applied the same way to every read and write, and the platform-specific real-path
              code must be isolated in one place that can be reviewed and tested on each platform.
            children:
              - DictionaryMark-FileAccessPolicy-ModeParsing
              - DictionaryMark-FileAccessPolicy-AnyMode
              - DictionaryMark-FileAccessPolicy-NeverAccessed
              - DictionaryMark-FileAccessPolicy-NetworkLocations
              - DictionaryMark-FileAccessPolicy-ColonFileNames
              - DictionaryMark-FileAccessPolicy-RootsWrittenPath
              - DictionaryMark-FileAccessPolicy-RootsRealPath
              - DictionaryMark-FileAccessPolicy-NoSymlinks
              - DictionaryMark-FileAccessPolicy-RealPathUnavailable
              - DictionaryMark-FileAccessPolicy-Writes
              - DictionaryMark-FileAccessPolicy-DenialMessage
              - DictionaryMark-RealPath-FinalPath
              - DictionaryMark-RealPath-RegularFile
              - DictionaryMark-RealPath-CanonicalDirectory
              - DictionaryMark-RealPath-NoTruncateOpen
              - DictionaryMark-RealPath-Comparison
              - DictionaryMark-RealPath-Classification
              - DictionaryMark-RealPath-LinkTargetWalk
            tests:
              - UtilitiesSubsystem_FileAccess_RootsConfinesReadsAndWrites
              - UtilitiesSubsystem_FileAccess_NeverAccessedInAnyMode
