---
# DictionaryMark GlobMatcher unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Utilities Requirements
        sections:
          - title: GlobMatcher Requirements
            requirements:
              - id: DictionaryMark-GlobMatcher-GetFiles
                title: >-
                  The GlobMatcher shall resolve files matching the provided glob patterns and return
                  a sorted, deduplicated list of matching file paths.
                justification: |
                  Glob patterns allow users to specify multiple input files concisely, supporting
                  workflows where dictionary files follow consistent naming conventions. Sorted and
                  deduplicated output produces deterministic results regardless of pattern order or
                  overlap between patterns.
                children:
                  - DictionaryMark-OTS-FileSystemGlobbing
                tests:
                  - GlobMatcher_GetFiles_ExistingAbsolutePath_ReturnsFile
                  - GlobMatcher_GetFiles_NonExistentAbsolutePath_ReturnsEmpty
                  - GlobMatcher_GetFiles_EmptyPatternList_ReturnsEmpty
                  - GlobMatcher_GetFiles_DuplicateAbsolutePaths_DeduplicatesResults
                  - GlobMatcher_GetFiles_AbsolutePathGlobPattern_ReturnsMatchingFiles
                  - GlobMatcher_GetFiles_AbsolutePathGlobPattern_NoMatches_ReturnsEmpty
                  - GlobMatcher_GetFiles_RelativeGlobPattern_ReturnsMatchingFiles

              - id: DictionaryMark-GlobMatcher-NullCollectionRejection
                title: The GlobMatcher shall throw an exception when a null patterns collection is provided.
                justification: |
                  Rejecting a null collection before iterating prevents NullReferenceException
                  and makes the contract explicit.
                tests:
                  - GlobMatcher_GetFiles_NullPatterns_ThrowsArgumentNullException

              - id: DictionaryMark-GlobMatcher-InvalidPatternRejection
                title: The GlobMatcher shall throw an exception when a null or empty pattern element is provided.
                justification: |
                  Clear error messages help users identify invalid input patterns quickly.
                tests:
                  - GlobMatcher_GetFiles_NullOrEmptyPattern_ThrowsArgumentException

              - id: DictionaryMark-GlobMatcher-StrictResolve
                title: >-
                  The GlobMatcher shall resolve patterns strictly, failing with an error that names the
                  pattern or full path when a glob matches no file or a literal directory or file does
                  not exist, and supporting relative, absolute and UNC paths.
                justification: |
                  A path or glob that matches nothing must never silently produce an empty glossary.
                tests:
                  - GlobMatcher_Resolve_LiteralAndGlob_ReturnsFiles
                  - GlobMatcher_Resolve_GlobWithNoMatch_ThrowsNamingPattern
                  - GlobMatcher_Resolve_MissingFileOrDirectory_ThrowsDistinctErrors
                  - GlobMatcher_Resolve_RelativeLiteral_ResolvesFullPath
                  - GlobMatcher_Resolve_UncPath_ResolvesOnWindows

              - id: DictionaryMark-GlobMatcher-EnvironmentVariables
                title: >-
                  The GlobMatcher shall expand ${VAR} environment-variable references in patterns and
                  fail with an error naming the variable when it is undefined or empty.
                justification: |
                  Environment variables let shared glossary locations differ between machines without
                  changing command lines.
                tests:
                  - GlobMatcher_Resolve_EnvironmentVariable_IsExpandedOrFails
