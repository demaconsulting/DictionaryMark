---
# DictionaryMark RealPath unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Utilities Requirements
        sections:
          - title: RealPath Requirements
            requirements:
              - id: DictionaryMark-RealPath-FinalPath
                title: >-
                  The RealPath unit shall report the real path of an open file, with symbolic links, junctions and
                  system folder links resolved, on Windows, Linux and macOS.
                justification: |
                  Access decisions must be made on the file that was actually opened, not on its name.
                tests:
                  - windows@RealPath_Inspect_PlainFile_ReportsRealPathAndRegular
                  - ubuntu@RealPath_Inspect_PlainFile_ReportsRealPathAndRegular
                  - macos@RealPath_Inspect_PlainFile_ReportsRealPathAndRegular
                  - windows@RealPath_Inspect_FileThroughDirectoryLink_ReportsTarget
                  - ubuntu@RealPath_Inspect_FileThroughDirectoryLink_ReportsTarget
                  - macos@RealPath_Inspect_FileThroughDirectoryLink_ReportsTarget
                  - macos@RealPath_Inspect_TempFile_ReportsPrivateLocation

              - id: DictionaryMark-RealPath-RegularFile
                title: >-
                  The RealPath unit shall report whether an open handle is a regular file, shall open a named pipe
                  for reading without blocking, and shall open a folder for reading (on Windows with backup
                  semantics) so its handle reports it as not a regular file.
                justification: |
                  Devices, pipes and folders must be recognized from the handle, never by a by-name probe, and opening
                  one must never hang the run.
                tests:
                  - RealPath_OpenForRead_Directory_HandleIsNotRegular
                  - RealPath_OpenForRead_MissingFile_ThrowsFileNotFound
                  - ubuntu@RealPath_Inspect_DevNull_IsNotRegular
                  - macos@RealPath_Inspect_DevNull_IsNotRegular
                  - ubuntu@RealPath_OpenForRead_Fifo_DoesNotBlockAndIsNotRegular
                  - macos@RealPath_OpenForRead_Fifo_DoesNotBlockAndIsNotRegular
                  - windows@RealPath_Inspect_NulDevice_IsNotRegular

              - id: DictionaryMark-RealPath-CanonicalDirectory
                title: >-
                  The RealPath unit shall report, from a handle opened without access rights (Windows; Linux O_PATH)
                  or realpath(3) (macOS), whose result is judged, whether a path exists (a missing entry, a missing
                  folder of its path and a link whose target is missing being missing), whether it is a folder
                  (except on macOS) and its real location, also for a Windows path longer than the classic limit;
                  and, for a folder check, whether the path is an existing folder on every platform (on macOS from a
                  handle opened with O_DIRECTORY, so a file is missing).
                justification: |
                  Allowed folders, trusted anchors, listed folders, output folders and existing outputs are judged by
                  facts taken from a handle, whose real path follows any link swapped in before the open.
                tests:
                  - RealPath_InspectPath_FileFolderMissing_Classified
                  - RealPath_InspectFolder_FolderFileMissing_Classified
                  - windows@RealPath_InspectPath_LongPath_ReportsRealPath
                  - windows@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTarget
                  - ubuntu@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTarget
                  - macos@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTarget
                  - RealPath_TryGetCanonicalDirectory_MissingDirectory_ReturnsNull

              - id: DictionaryMark-RealPath-NoTruncateOpen
                title: >-
                  The RealPath unit shall open an existing file for writing without changing its content (on Linux
                  and macOS reporting a folder as not openable), and create a new file only when no entry, including
                  a link, has its name.
                justification: |
                  The real path of an output must be checked before its content changes, and a link planted at the
                  output name must not make the tool create a file elsewhere.
                tests:
                  - RealPath_TryOpenExistingForWrite_ExistingFile_KeepsContent
                  - RealPath_CreateNewForWrite_ExistingEntry_Throws
                  - ubuntu@RealPath_TryOpenExistingForWrite_Directory_ReturnsNull
                  - macos@RealPath_TryOpenExistingForWrite_Directory_ReturnsNull

              - id: DictionaryMark-RealPath-Comparison
                title: >-
                  The RealPath unit shall compare paths with the platform's case rule, treat a folder boundary as a
                  whole component, and find the deepest folder two paths share.
                justification: |
                  Confinement decisions depend on exact, platform-correct path comparisons.
                tests:
                  - RealPath_IsUnder_BoundaryIsSeparator
                  - RealPath_PathsEqual_PlatformCaseRule
                  - RealPath_CommonAncestor_ReturnsDeepestSharedFolder
                  - RealPath_ExpandShortNames_PathWithoutShortName_Unchanged

              - id: DictionaryMark-RealPath-Classification
                title: >-
                  The RealPath unit shall classify UNC and mapped-drive paths as network locations on Windows,
                  recognize every Windows reserved device name, recognize an ordinary extended-length drive or
                  volume path, and recognize symbolic links and junctions.
                justification: |
                  The never-accessed list and the output checks depend on these classifications.
                tests:
                  - windows@RealPath_IsNetworkLocation_UncAndLocal_Classified
                  - RealPath_IsWindowsDeviceName_ReservedSpellings
                  - RealPath_IsOrdinaryExtendedPath_Classified
                  - windows@RealPath_IsLink_SymlinkOrJunction_True
                  - ubuntu@RealPath_IsLink_SymlinkOrJunction_True
                  - macos@RealPath_IsLink_SymlinkOrJunction_True

              - id: DictionaryMark-RealPath-LinkTargetWalk
                title: >-
                  On Windows, the RealPath unit shall find, without following any link, a symbolic link or
                  junction at any component of a path (including a chain of links and a relative target) whose
                  target is a network location, and shall stop after 63 links.
                justification: |
                  The file-access policy must deny such a path before the open contacts the share. Reading each
                  link's own target, never a component through an unchecked link, keeps the walk off the network,
                  and Windows does not open a path that needs more than 63 links.
                tests:
                  - windows@RealPath_FindNetworkLinkTarget_IntermediateLinkToShare_ReturnsNetworkPath
                  - windows@RealPath_FindNetworkLinkTarget_LocalLinksAndLoop_ReturnsNull
                  - windows@RealPath_FindNetworkLinkTarget_RealLocalLink_ReturnsNull
