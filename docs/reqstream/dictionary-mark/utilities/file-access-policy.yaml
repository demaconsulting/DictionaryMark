---
# DictionaryMark FileAccessPolicy unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Utilities Requirements
        sections:
          - title: FileAccessPolicy Requirements
            requirements:
              - id: DictionaryMark-FileAccessPolicy-ModeParsing
                title: >-
                  The FileAccessPolicy unit shall parse any, roots, no-symlinks and roots,no-symlinks (in either
                  order, in any letter case, with spaces around the items) and reject every other value, including
                  a repeated or empty item, with a message that lists the modes.
                justification: |
                  A typing error must never select a weaker mode than the user intended.
                tests:
                  - FileAccessPolicy_ParseMode_ValidValues_Parsed
                  - FileAccessPolicy_ParseMode_InvalidValues_ThrowsListingModes

              - id: DictionaryMark-FileAccessPolicy-AnyMode
                title: >-
                  Under the any mode, the FileAccessPolicy unit shall read and write every regular local file that
                  is not on the never-accessed list, creating missing output folders.
                justification: |
                  The default mode must keep the behavior of earlier versions for ordinary paths.
                tests:
                  - FileAccessPolicy_ReadAllText_AnyModeOutsideFolders_ReturnsContent
                  - FileAccessPolicy_WriteAllText_AnyMode_CreatesFoldersAndWrites

              - id: DictionaryMark-FileAccessPolicy-NeverAccessed
                title: >-
                  In every mode, the FileAccessPolicy unit shall deny a URL (a scheme followed by ://), a file: URI
                  with a host, a path written as a UNC path, a device path (a written \\?\ or \\.\ path, on Windows
                  a written \??\ path, a full path in a device namespace other than an ordinary extended-length
                  drive or volume path, or a reserved device name), a colon other than the drive of an absolute path
                  on Windows (on Linux and macOS, any colon), on Linux and macOS a path to be read, written or listed
                  whose full path is under /dev or whose real path, or the real path of its deepest existing folder,
                  is under /dev, and anything that is not a regular file, without blocking on a named pipe, judging
                  the text after ${VAR} expansion (for a file a glob matched, the pattern's literal part followed by
                  the matched path), before the path is opened, created, listed or probed.
                justification: |
                  These locations can leak credentials, hang the run, act on a device or reach hidden data. The rules
                  follow the DEMA Consulting CanvasNet tool, including its colon rule on every platform and its rule
                  that the text is judged after expansion, so a configuration file is judged the same everywhere and a
                  variable or a matched file name cannot slip past the rules. Paths under /dev are denied for reads,
                  writes and listing alike, before the open and including through a link to a folder or a file
                  there, because opening a device node can act on the device, and a regular file under /dev (for
                  example in /dev/shm) is not configuration content; CanvasNet refuses a device only by its handle
                  type.
                tests:
                  - FileAccessPolicy_DescribeNeverAccessed_HostileText_ReturnsReason
                  - FileAccessPolicy_DescribeNeverAccessed_OrdinaryPaths_ReturnsNull
                  - FileAccessPolicy_DescribeNeverAccessed_Colon_ReturnsReason
                  - FileAccessPolicy_ColonInWrittenPath_DeniedBeforeOpenNothingWritten
                  - FileAccessPolicy_JudgedPath_ExpandedTextJudged_ShownAsWritten
                  - FileAccessPolicy_ResolvePattern_UrlPattern_Denied
                  - FileAccessPolicy_ResolvePattern_GlobMatch_ExpandedIsPrefixPlusMatch
                  - FileAccessPolicy_ReadAllText_Directory_Denied
                  - FileAccessPolicy_WriteAllText_ExistingDirectory_Denied
                  - FileAccessPolicy_ReadAllText_NotRegularHandle_Denied
                  - windows@FileAccessPolicy_DescribeNeverAccessed_NtNamespaceOnWindows_ReturnsReason
                  - windows@FileAccessPolicy_ReadAllText_WindowsDeviceName_Denied
                  - windows@FileAccessPolicy_DescribeNeverAccessedFullPath_SharesAndExtendedPaths
                  - windows@FileAccessPolicy_ReadAllText_ExtendedLengthBase_ReturnsContent
                  - ubuntu@FileAccessPolicy_DescribeNeverAccessed_DrivePathOnLinuxAndMac_ReturnsColonReason
                  - macos@FileAccessPolicy_DescribeNeverAccessed_DrivePathOnLinuxAndMac_ReturnsColonReason
                  - ubuntu@FileAccessPolicy_ReadAllText_DevPath_DeniedBeforeOpen
                  - macos@FileAccessPolicy_ReadAllText_DevPath_DeniedBeforeOpen
                  - ubuntu@FileAccessPolicy_ResolvePattern_DevFolder_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_DevFolder_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_WildcardIntoDev_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_WildcardIntoDev_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_DescribeNeverAccessedFullPath_DevOnLinuxAndMac_ReturnsDeviceReason
                  - macos@FileAccessPolicy_DescribeNeverAccessedFullPath_DevOnLinuxAndMac_ReturnsDeviceReason
                  - ubuntu@FileAccessPolicy_DescribeNeverAccessedFolder_RealPathUnderDev_ReturnsDeviceReason
                  - macos@FileAccessPolicy_DescribeNeverAccessedFolder_RealPathUnderDev_ReturnsDeviceReason
                  - ubuntu@FileAccessPolicy_WriteAllText_DevPath_DeniedBeforeOpen
                  - macos@FileAccessPolicy_WriteAllText_DevPath_DeniedBeforeOpen
                  - ubuntu@FileAccessPolicy_WriteAllText_FolderLinkToDev_DeniedBeforeOpen
                  - macos@FileAccessPolicy_WriteAllText_FolderLinkToDev_DeniedBeforeOpen
                  - ubuntu@FileAccessPolicy_WriteAllText_FileLinkToDevice_DeniedBeforeOpen
                  - macos@FileAccessPolicy_WriteAllText_FileLinkToDevice_DeniedBeforeOpen
                  - ubuntu@FileAccessPolicy_ReadAllText_GlobMatchWithColon_Denied
                  - macos@FileAccessPolicy_ReadAllText_GlobMatchWithColon_Denied
                  - ubuntu@FileAccessPolicy_DescribeNeverAccessed_DeviceTextOnLinuxAndMac_ReturnsNull
                  - macos@FileAccessPolicy_DescribeNeverAccessed_DeviceTextOnLinuxAndMac_ReturnsNull
                  - ubuntu@FileAccessPolicy_ReadAllText_Fifo_DeniedWithoutBlocking
                  - macos@FileAccessPolicy_ReadAllText_Fifo_DeniedWithoutBlocking

              - id: DictionaryMark-FileAccessPolicy-OpenedHandleNeverAccessed
                title: >-
                  In every mode, including the any mode, the FileAccessPolicy unit shall apply the never-accessed
                  rules that can be judged from a real path (on Linux and macOS a real path under /dev, on Windows a
                  real path in a device namespace or a local path whose real path is on a network location), together
                  with the regular-file rule, to the real path of every opened read and write handle, before anything
                  is read, truncated or written through it and before the mode's rules, so a folder swapped for a link
                  between the checks and the open is still refused and no content is written there.
                justification: |
                  The checks made before the open judge a path by name, and another process can swap a folder of that
                  path for a link (for example to the world-writable /dev/shm, or to a share) before the open. Only
                  the real path of the opened handle tells where the open went, so the never-accessed rules must hold
                  on it in every mode, not only in a restrictive one. A new output created by the exclusive create and
                  then denied is left empty, never written and never deleted, because a delete by name could remove
                  another file and would itself access the refused location.
                tests:
                  - FileAccessPolicy_ReadAllText_HandleOnNeverAccessedList_DeniedUnderAny
                  - FileAccessPolicy_WriteAllText_HandleOnNeverAccessedList_DeniedNothingWritten
                  - ubuntu@FileAccessPolicy_WriteAllText_HandleUnderDev_DeniedBeforeModeRules
                  - macos@FileAccessPolicy_WriteAllText_HandleUnderDev_DeniedBeforeModeRules
                  - ubuntu@FileAccessPolicy_WriteAllText_ParentSwappedToDevBeforeOpen_DeniedNothingWritten
                  - ubuntu@FileAccessPolicy_ReadAllText_ParentSwappedToDevBeforeOpen_Denied
                  - windows@FileAccessPolicy_WriteAllText_ParentSwappedOutBeforeOpen_DeniedByHandle
                  - ubuntu@FileAccessPolicy_WriteAllText_ParentSwappedOutBeforeOpen_DeniedByHandle
                  - macos@FileAccessPolicy_WriteAllText_ParentSwappedOutBeforeOpen_DeniedByHandle

              - id: DictionaryMark-FileAccessPolicy-NetworkLocations
                title: >-
                  On Windows, the FileAccessPolicy unit shall access a path that is itself a network location (on a
                  mapped network drive, or resolved against a folder on a share), and shall deny a path that is not a
                  network location but leads to one through a symbolic link or junction, before it is opened,
                  created, listed or probed where the links can be read (including every folder a glob wildcard
                  would descend into), and otherwise by the real path of the opened file or folder.
                justification: |
                  This is the network rule of the DEMA Consulting CanvasNet tool. A configuration file kept on a share
                  or a mapped network drive must keep working with relative paths, while a local path must not be
                  able to reach a share, and leak credentials to it, through a link.
                tests:
                  - windows@FileAccessPolicy_LeadsToNetwork_LocalToShareOnly
                  - windows@FileAccessPolicy_CheckPath_PathOnShare_AllowedWithoutWalk
                  - windows@FileAccessPolicy_ReadAllText_LocalPathRealPathOnShare_Denied
                  - windows@FileAccessPolicy_ReadAllText_IntermediateLinkToShare_DeniedBeforeOpen
                  - windows@FileAccessPolicy_WriteAllText_IntermediateLinkToShare_DeniedNothingCreated
                  - windows@FileAccessPolicy_ResolvePattern_PrefixLinkToShare_DeniedBeforeMatching
                  - windows@FileAccessPolicy_ResolvePattern_LinkUnderWildcardToShare_DeniedBeforeListing
                  - windows@FileAccessPolicy_DescribeNeverAccessedFolder_LinkToShare_ReturnsReason
                  - windows@FileAccessPolicy_DescribeNeverAccessedFullPath_SharesAndExtendedPaths

              - id: DictionaryMark-FileAccessPolicy-RootsWrittenPath
                title: >-
                  Under the roots mode, the FileAccessPolicy unit shall deny, before opening it, a path whose full
                  path as written is not inside an allowed folder, using whole path components so a sibling folder
                  with a shared name prefix is outside, and comparing letter case by the platform's default rule
                  (ignoring case on Windows and macOS) as a check made before the real path is judged.
                justification: |
                  A path that climbs out with parent-directory segments or a variable must be refused without
                  touching the file it names. The path as written follows the platform's default letter-case rule,
                  so a path written in another letter case than the folder on disk is not refused before its real
                  path, which is always judged exactly, can be checked.
                tests:
                  - FileAccessPolicy_ReadAllText_InsideFolder_ReturnsContent
                  - FileAccessPolicy_ReadAllText_WrittenPathOutside_DeniedBeforeOpen
                  - FileAccessPolicy_ReadAllText_SiblingWithSharedPrefix_Denied
                  - FileAccessPolicy_ResolvePattern_LiteralOutside_Denied
                  - FileAccessPolicy_ResolvePattern_RootsFolderOutside_DeniedBeforeMatching

              - id: DictionaryMark-FileAccessPolicy-RootsRealPath
                title: >-
                  Under the roots mode, the FileAccessPolicy unit shall deny a file whose real path is outside the
                  real location of every allowed folder, comparing letter case exactly, so a folder whose name
                  differs from an allowed folder's only in letter case is outside on a file system that
                  distinguishes case, while a path written in another letter case that names a file inside an
                  allowed folder on a file system that ignores case is allowed; shall deny a file whose path as
                  written is outside even when it links back in, while allowing a link that stays inside; and shall
                  let an allowed folder that is not a folder (for example one replaced by a file) allow nothing.
                justification: |
                  Both the written and the real path must be inside, or a link could lead out or a path outside
                  could link in. A folder or volume may distinguish letter case on every platform (a Windows folder
                  with per-folder case sensitivity, a case-sensitive APFS volume), and there a case-variant sibling
                  of an allowed folder is a different folder, so ignoring case would let it be read and written. An
                  allowed folder replaced by a file after it was checked must fail closed rather than allow that file.
                tests:
                  - FileAccessPolicy_Create_AllowedFolderIsFile_AllowsNothing
                  - FileAccessPolicy_ReadAllText_RealPathInCaseVariantSibling_Denied
                  - FileAccessPolicy_WriteAllText_RealPathInCaseVariantSibling_ContentUnchanged
                  - ubuntu@FileAccessPolicy_ReadAllText_CaseVariantSiblingOfAllowedFolder_Denied
                  - ubuntu@FileAccessPolicy_WriteAllText_CaseVariantSiblingOfAllowedFolder_DeniedNothingWritten
                  - windows@FileAccessPolicy_ReadAllText_DifferentlyCasedWrittenPath_Allowed
                  - macos@FileAccessPolicy_ReadAllText_DifferentlyCasedWrittenPath_Allowed
                  - windows@FileAccessPolicy_WriteAllText_DifferentlyCasedWrittenPath_CreatesAndWrites
                  - macos@FileAccessPolicy_WriteAllText_DifferentlyCasedWrittenPath_CreatesAndWrites
                  - windows@FileAccessPolicy_ReadAllText_DirectoryLinkLeadingOut_Denied
                  - ubuntu@FileAccessPolicy_ReadAllText_DirectoryLinkLeadingOut_Denied
                  - macos@FileAccessPolicy_ReadAllText_DirectoryLinkLeadingOut_Denied
                  - windows@FileAccessPolicy_ReadAllText_OutsidePathLinkingBackIn_Denied
                  - ubuntu@FileAccessPolicy_ReadAllText_OutsidePathLinkingBackIn_Denied
                  - macos@FileAccessPolicy_ReadAllText_OutsidePathLinkingBackIn_Denied
                  - windows@FileAccessPolicy_ReadAllText_DirectoryLinkStayingInside_Allowed
                  - ubuntu@FileAccessPolicy_ReadAllText_DirectoryLinkStayingInside_Allowed
                  - macos@FileAccessPolicy_ReadAllText_DirectoryLinkStayingInside_Allowed

              - id: DictionaryMark-FileAccessPolicy-NoSymlinks
                title: >-
                  Under the no-symlinks mode, the FileAccessPolicy unit shall deny a file whose real path differs
                  from the real location of its trusted anchor (the deepest folder it shares with the trusted base
                  folder, comparing folder names with letter case significant) followed by the path as written below
                  it, trusting links in the anchor and above it.
                justification: |
                  Comparing the real path with the expected path detects any symbolic link or junction below the
                  anchor without walking each component by name, which would race with changes. On a file system
                  that distinguishes case, a link named as a case variant of a folder above the trusted base folder
                  must not be taken for that folder and trusted.
                tests:
                  - ubuntu@FileAccessPolicy_ReadAllText_NoSymlinksCaseVariantAnchorLink_Denied
                  - windows@FileAccessPolicy_ReadAllText_NoSymlinksLinkBelowTrustedBase_Denied
                  - ubuntu@FileAccessPolicy_ReadAllText_NoSymlinksLinkBelowTrustedBase_Denied
                  - macos@FileAccessPolicy_ReadAllText_NoSymlinksLinkBelowTrustedBase_Denied
                  - windows@FileAccessPolicy_ReadAllText_NoSymlinksLinkAboveTrustedBase_Allowed
                  - ubuntu@FileAccessPolicy_ReadAllText_NoSymlinksLinkAboveTrustedBase_Allowed
                  - macos@FileAccessPolicy_ReadAllText_NoSymlinksLinkAboveTrustedBase_Allowed
                  - ubuntu@FileAccessPolicy_ReadAllText_NoSymlinksFileSymlink_Denied
                  - macos@FileAccessPolicy_ReadAllText_NoSymlinksFileSymlink_Denied

              - id: DictionaryMark-FileAccessPolicy-RealPathUnavailable
                title: >-
                  Under the roots and no-symlinks modes, the FileAccessPolicy unit shall deny a file whose real path
                  the platform cannot determine, and under the any mode shall still read it; in every mode it shall
                  deny a file whose type the platform cannot determine, with a reason stating that its type cannot be
                  determined rather than that it is not a regular file.
                justification: |
                  A restrictive mode that cannot be applied must fail closed rather than read the file unchecked.
                  Only regular files are ever accessed, so a file whose type is unknown is refused in every mode, but
                  an unknown type must not be reported as a special file, so the user is told the real cause.
                tests:
                  - FileAccessPolicy_ReadAllText_RealPathUnknown_DeniedUnderRestrictiveModes
                  - FileAccessPolicy_ReadAllText_RealPathUnknown_AllowedUnderAny
                  - FileAccessPolicy_ReadAllText_TypeUnknown_DeniedWithTypeReason
                  - FileAccessPolicy_WriteAllText_TypeUnknown_ContentUnchanged

              - id: DictionaryMark-FileAccessPolicy-Writes
                title: >-
                  The FileAccessPolicy unit shall write an output only after its path, its deepest existing parent
                  folder, every folder it creates (one level at a time, each verified in every mode where its
                  parent's real location is known) and the real path of the opened output pass the mode; shall open
                  an existing output without truncating it and replace its content only after verification; shall
                  never take an existing entry that is not a folder for an output's existing parent folder; and
                  shall write nothing, not even a folder, when the output is denied.
                justification: |
                  A write that leads out of the allowed folders could overwrite any file the user can write, so
                  every step is checked before any change is made.
                tests:
                  - FileAccessPolicy_WriteAllText_AnyMode_CreatesFoldersAndWrites
                  - FileAccessPolicy_WriteAllText_OutputOutside_DeniedNothingWritten
                  - FileAccessPolicy_WriteAllText_MissingFoldersInside_Created
                  - FileAccessPolicy_WriteAllText_ExistingOutput_ReplacedContent
                  - FileAccessPolicy_WriteAllText_NotRegularHandle_ContentUnchanged
                  - FileAccessPolicy_WriteAllText_ParentIsFile_FailsNothingWritten
                  - windows@FileAccessPolicy_WriteAllText_ParentFolderLinkLeadingOut_DeniedNoFolderCreated
                  - ubuntu@FileAccessPolicy_WriteAllText_ParentFolderLinkLeadingOut_DeniedNoFolderCreated
                  - macos@FileAccessPolicy_WriteAllText_ParentFolderLinkLeadingOut_DeniedNoFolderCreated
                  - ubuntu@FileAccessPolicy_WriteAllText_ExistingOutputSymlinkLeadingOut_DeniedTargetUnchanged
                  - macos@FileAccessPolicy_WriteAllText_ExistingOutputSymlinkLeadingOut_DeniedTargetUnchanged
                  - windows@FileAccessPolicy_WriteAllText_NoSymlinksLinkedFolder_Denied
                  - ubuntu@FileAccessPolicy_WriteAllText_NoSymlinksLinkedFolder_Denied
                  - macos@FileAccessPolicy_WriteAllText_NoSymlinksLinkedFolder_Denied

              - id: DictionaryMark-FileAccessPolicy-GlobListing
                title: >-
                  The FileAccessPolicy unit shall judge the literal folder of a glob pattern by the never-accessed
                  list and the mode (under roots, its path as written and its real path inside an allowed folder;
                  under no-symlinks, no link below the trusted anchor) before the folder is listed, shall judge every
                  folder a wildcard would descend into, plain or a link, the same way before it is listed, and shall
                  fail the pattern when either is denied; a literal folder that does not exist or is not a folder
                  shall give no matches.
                justification: |
                  Listing a folder touches it and reveals the names in it, and a folder reached by a wildcard can be
                  /dev or a link that leads anywhere, including a share. Judging each listed folder first keeps
                  matching inside what the mode allows, and failing the pattern, rather than skipping the folder,
                  never silently drops input.
                tests:
                  - FileAccessPolicy_ResolvePattern_RootsFolderOutside_DeniedBeforeMatching
                  - FileAccessPolicy_ResolvePattern_MissingFolder_ReturnsEmpty
                  - FileAccessPolicy_ResolvePattern_FolderIsFile_ReturnsEmpty
                  - windows@FileAccessPolicy_ResolvePattern_RootsFolderIsFileLinkLeadingOut_ReturnsEmpty
                  - ubuntu@FileAccessPolicy_ResolvePattern_RootsFolderIsFileLinkLeadingOut_ReturnsEmpty
                  - macos@FileAccessPolicy_ResolvePattern_RootsFolderIsFileLinkLeadingOut_ReturnsEmpty
                  - windows@FileAccessPolicy_ResolvePattern_NoSymlinksPrefixThroughLink_DeniedBeforeMatching
                  - ubuntu@FileAccessPolicy_ResolvePattern_NoSymlinksPrefixThroughLink_DeniedBeforeMatching
                  - macos@FileAccessPolicy_ResolvePattern_NoSymlinksPrefixThroughLink_DeniedBeforeMatching
                  - windows@FileAccessPolicy_ResolvePattern_RootsFolderLinkLeadingOut_DeniedBeforeMatching
                  - ubuntu@FileAccessPolicy_ResolvePattern_RootsFolderLinkLeadingOut_DeniedBeforeMatching
                  - macos@FileAccessPolicy_ResolvePattern_RootsFolderLinkLeadingOut_DeniedBeforeMatching
                  - windows@FileAccessPolicy_ResolvePattern_LinkUnderWildcard_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_LinkUnderWildcard_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_LinkUnderWildcard_DeniedBeforeListing
                  - windows@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardInside_Matched
                  - ubuntu@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardInside_Matched
                  - macos@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardInside_Matched
                  - windows@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardLeadingOut_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardLeadingOut_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_RootsLinkUnderWildcardLeadingOut_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_CaseVariantSiblingFolder_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_WildcardIntoDev_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_WildcardIntoDev_DeniedBeforeListing
                  - ubuntu@FileAccessPolicy_ResolvePattern_PlainFolderWithColonUnderWildcard_DeniedBeforeListing
                  - macos@FileAccessPolicy_ResolvePattern_PlainFolderWithColonUnderWildcard_DeniedBeforeListing

              - id: DictionaryMark-FileAccessPolicy-HandleClassification
                title: >-
                  After a path has been judged, the FileAccessPolicy unit shall tell whether it exists, whether it is
                  a folder and what its real path is only from a handle (Windows, Linux) or realpath(3) (macOS)
                  obtained after the path is judged, whose result is judged before anything is read, written, listed,
                  created or reported as existing through it, or by reading a link's own target, and never by a
                  by-name existence or attribute probe; a base (root:) folder's existence shall come from the same
                  open that judged it, and a literal input pattern shall be resolved without probing it.
                justification: |
                  A by-name probe follows links on the path without producing a handle whose real path can be judged,
                  so a link swapped in after the path was judged could reach a share or a folder outside the allowed
                  folders unchecked. Every operation that yields a handle is judged, which closes that gap.
                tests:
                  - FileAccessPolicy_ReadAllText_Directory_ClassifiedFromHandle
                  - FileAccessPolicy_ResolvePattern_Literal_ReturnedWithoutProbe
                  - FileAccessPolicy_DescribeNeverAccessedFolder_ExistenceFromFolderFacts
                  - windows@FileAccessPolicy_ReadAllText_LinkAppearingAfterWalk_DeniedByHandle
                  - ubuntu@FileAccessPolicy_ReadAllText_LinkAppearingAfterWalk_DeniedByHandle
                  - macos@FileAccessPolicy_ReadAllText_LinkAppearingAfterWalk_DeniedByHandle
                  - windows@FileAccessPolicy_WriteAllText_LinkAppearingAfterWalk_DeniedByHandle
                  - ubuntu@FileAccessPolicy_WriteAllText_LinkAppearingAfterWalk_DeniedByHandle
                  - macos@FileAccessPolicy_WriteAllText_LinkAppearingAfterWalk_DeniedByHandle

              - id: DictionaryMark-FileAccessPolicy-DenialMessage
                title: >-
                  The FileAccessPolicy unit shall report a denial as file-access-denied followed by the path as
                  written, the real path when it is known, and the reason.
                justification: |
                  A fixed error code and both paths let a user see what was refused and where the path really led.
                tests:
                  - FileAccessDeniedException_Message_ContainsCodePathsAndReason
                  - FileAccessDeniedException_Message_UnknownRealPath_OmitsRealPart
