---
# DictionaryMark YamlDictionaryLoader unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Dictionary Requirements
        sections:
          - title: YamlDictionaryLoader Requirements
            requirements:
              - id: DictionaryMark-YamlLoader-Load
                title: The YamlDictionaryLoader class shall load flat YAML key-value mappings as dictionary entries.
                justification: |
                  YAML is a human-friendly format for maintaining dictionary data. The loader must
                  handle flat mappings and report structural errors clearly.
                children:
                  - DictionaryMark-OTS-YamlDotNet
                tests:
                  - YamlDictionaryLoader_Load_ValidFlatYaml_ReturnsEntries
                  - YamlDictionaryLoader_Load_EmptyFile_ReturnsEmptyList
                  - YamlDictionaryLoader_Load_SingleEntry_ReturnsOneEntry

              - id: DictionaryMark-YamlLoader-StructureErrors
                title: The YamlDictionaryLoader class shall throw InvalidOperationException for non-flat YAML structures.
                justification: |
                  Non-flat YAML (nested mappings, sequences) is not a valid dictionary format.
                  The loader must reject such structures with a clear error to help users fix invalid files.
                tests:
                  - YamlDictionaryLoader_Load_NestedYaml_ThrowsInvalidOperationException
                  - YamlDictionaryLoader_Load_ListYaml_ThrowsInvalidOperationException

              - id: DictionaryMark-YamlLoader-FileErrors
                title: The YamlDictionaryLoader class shall throw IOException when the specified file cannot be read.
                justification: |
                  Missing or inaccessible files are a common operational error. Propagating the
                  IOException allows callers to report a clear, actionable message to the user.
                tests:
                  - YamlDictionaryLoader_Load_NonExistentFile_ThrowsFileNotFoundException

              - id: DictionaryMark-YamlLoader-NullInput
                title: The YamlDictionaryLoader class shall throw ArgumentNullException when filePath is null.
                justification: |
                  A null file path is a caller contract violation. Failing fast with ArgumentNullException
                  keeps the API contract explicit and prevents ambiguous downstream file-system errors.
                tests:
                  - YamlDictionaryLoader_Load_NullFilePath_ThrowsArgumentNullException

              - id: DictionaryMark-YamlLoader-DuplicateKeys
                title: >-
                  The YamlDictionaryLoader class shall throw InvalidOperationException when a YAML file
                  contains duplicate keys.
                justification: |
                  Duplicate keys within a single file represent a data quality error. Detecting
                  them at load time prevents silent data loss or unpredictable behavior downstream.
                tests:
                  - YamlDictionaryLoader_Load_DuplicateKey_ThrowsInvalidOperationException

              - id: DictionaryMark-YamlLoader-RichEntries
                title: >-
                  The YamlDictionaryLoader class shall load an approved-term entry given as either a
                  definition string or an object with definition, pos, variants and visible fields,
                  applying the defaults noun, no variants and visible.
                justification: |
                  A single YAML file must serve both the generated glossary and other tools that need
                  part of speech and alternate spellings, while flat term/definition files keep working.
                tests:
                  - YamlDictionaryLoader_Load_PlainString_HasDefaultMetadata
                  - YamlDictionaryLoader_Load_ObjectEntry_ReadsAllFields
                  - YamlDictionaryLoader_Load_PosString_VisibleString_Accepted
                  - YamlDictionaryLoader_Load_Term_IsWhitespaceNormalized

              - id: DictionaryMark-YamlLoader-DefinitionRequired
                title: >-
                  The YamlDictionaryLoader class shall require every approved-term entry to have a
                  non-empty definition string, regardless of its visible value, and shall report an
                  error naming the term and file otherwise.
                justification: |
                  Every approved term must be explained; a missing, null or empty definition is a data
                  error that must be surfaced rather than rendered as an empty cell.
                tests:
                  - YamlDictionaryLoader_Load_EmptyDefinitionString_ThrowsNamingTermAndFile
                  - YamlDictionaryLoader_Load_NullValue_Throws
                  - YamlDictionaryLoader_Load_ObjectWithoutDefinition_Throws

              - id: DictionaryMark-YamlLoader-FieldValidation
                title: >-
                  The YamlDictionaryLoader class shall reject unknown keys, unsupported pos values,
                  invalid visible values, invalid variants, empty terms and non-string, non-object
                  entry values with an error naming the term and file.
                justification: |
                  Typos such as a misspelled key must not be silently ignored, and invalid metadata
                  would mislead downstream tools that read the same file.
                tests:
                  - YamlDictionaryLoader_Load_UnknownKey_Throws
                  - YamlDictionaryLoader_Load_InvalidFieldValue_Throws
                  - YamlDictionaryLoader_Load_EmptyTerm_Throws
                  - YamlDictionaryLoader_Load_SequenceValue_Throws

              - id: DictionaryMark-YamlLoader-Deprecated
                title: >-
                  The YamlDictionaryLoader class shall load deprecated-term entries consisting of a
                  required non-empty use value and an optional where value, and reject anything else.
                justification: |
                  Deprecated terms are a separate kind of entry that tell authors what to use instead;
                  they never carry a definition.
                tests:
                  - YamlDictionaryLoader_LoadDeprecated_ValidEntries_ReturnsEntries
                  - YamlDictionaryLoader_LoadDeprecated_Invalid_Throws
                  - DictionaryEntry_Constructor_TermAndDefinition_HasDefaultMetadata
                  - DictionaryEntry_Constructor_FullMetadata_SetsProperties
                  - DictionaryEntry_Constructor_NullDefinition_ThrowsArgumentNullException
