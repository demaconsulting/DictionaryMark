---
# DictionaryMark DictionaryGenerator unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Dictionary Requirements
        sections:
          - title: DictionaryGenerator Requirements
            requirements:
              - id: DictionaryMark-DictionaryGenerator-FileLoading
                title: >-
                  The DictionaryGenerator shall resolve input glob patterns to file paths and load
                  dictionary entries from each matched file.
                justification: |
                  The generator must discover all matching YAML files and load their entries before
                  any processing can occur. This is the foundational step of the generation pipeline.
                tests:
                  - DictionaryGenerator_Generate_NoInputPatterns_ReportsError
                  - DictionaryGenerator_Generate_SingleYamlFile_WritesToStdout

              - id: DictionaryMark-DictionaryGenerator-ConflictReporting
                title: >-
                  The DictionaryGenerator shall report an error and set a non-zero exit code when
                  conflicting definitions are detected across input files.
                justification: |
                  Conflicting definitions indicate data quality issues that must be surfaced to the
                  user before output is generated, preventing incorrect documentation.
                tests:
                  - DictionaryGenerator_Generate_ConflictingEntries_ReportsError

              - id: DictionaryMark-DictionaryGenerator-OutputRouting
                title: >-
                  The DictionaryGenerator shall write formatted Markdown output to the configured
                  output file when specified, or to stdout when no output file is configured.
                justification: |
                  Flexible output routing enables integration with both interactive use (stdout) and
                  documentation pipelines that consume generated Markdown files.
                tests:
                  - DictionaryGenerator_Generate_SingleYamlFile_WritesToStdout
                  - DictionaryGenerator_Generate_OutputFile_WritesToFile

              - id: DictionaryMark-DictionaryGenerator-StrictInputs
                title: >-
                  The DictionaryGenerator shall report an error naming the pattern or full path, and
                  generate no output, when any input pattern matches no file or a literal file or
                  directory does not exist.
                justification: |
                  A missing input must never silently produce an empty or partial glossary.
                tests:
                  - DictionaryGenerator_Generate_MissingInputs_ReportErrors
                  - DictionaryGenerator_Generate_OneMissingPattern_Fails

              - id: DictionaryMark-DictionaryGenerator-RichEntries
                title: >-
                  The DictionaryGenerator shall omit invisible entries from the output, and shall
                  report an error naming the term and file for an approved entry without a definition.
                justification: |
                  Hidden entries are machine-only; a definition is required for every approved term.
                tests:
                  - DictionaryGenerator_Generate_HiddenEntry_OmittedFromOutput
                  - DictionaryGenerator_Generate_HiddenEntryWithoutDefinition_ReportsError

              - id: DictionaryMark-DictionaryGenerator-DeprecatedKind
                title: >-
                  The DictionaryGenerator shall generate a deprecated-terms table or bullet list when
                  the kind is deprecated, and shall check the input against files of the other kind
                  given with --check-against without producing output from them.
                justification: |
                  Deprecated terms are published like approved terms, and a term must not be both
                  approved and deprecated even when the two kinds are generated in separate runs.
                tests:
                  - DictionaryGenerator_Generate_DeprecatedKind_WritesTable
                  - DictionaryGenerator_Generate_DeprecatedKindCustomHeaders_AreUsed
                  - DictionaryGenerator_Generate_CheckAgainstDeprecated_ReportsConflict
                  - DictionaryGenerator_Generate_CheckAgainstNoConflict_OutputsOnlyPrimaryKind
