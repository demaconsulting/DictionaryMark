---
# DictionaryMark DictionaryGenerator unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Dictionary Requirements
        sections:
          - title: DictionaryGenerator Requirements
            requirements:
              - id: DictionaryMark-DictionaryGenerator-FileLoading
                title: >-
                  The DictionaryGenerator shall resolve input glob patterns to file paths and load
                  dictionary entries from each matched file.
                justification: |
                  The generator must discover all matching YAML files and load their entries before
                  any processing can occur. This is the foundational step of the generation pipeline.
                tests:
                  - DictionaryGenerator_Generate_NoInputPatterns_ReportsError
                  - DictionaryGenerator_Generate_SingleYamlFile_WritesToStdout

              - id: DictionaryMark-DictionaryGenerator-ConflictReporting
                title: >-
                  The DictionaryGenerator shall report an error and set a non-zero exit code when
                  conflicting definitions are detected across input files.
                justification: |
                  Conflicting definitions indicate data quality issues that must be surfaced to the
                  user before output is generated, preventing incorrect documentation.
                tests:
                  - DictionaryGenerator_Generate_ConflictingEntries_ReportsError

              - id: DictionaryMark-DictionaryGenerator-OutputRouting
                title: >-
                  The DictionaryGenerator shall write formatted Markdown output to the configured
                  output file when specified, or to stdout when no output file is configured.
                justification: |
                  Flexible output routing enables integration with both interactive use (stdout) and
                  documentation pipelines that consume generated Markdown files.
                tests:
                  - DictionaryGenerator_Generate_SingleYamlFile_WritesToStdout
                  - DictionaryGenerator_Generate_OutputFile_WritesToFile

              - id: DictionaryMark-DictionaryGenerator-StrictInputs
                title: >-
                  The DictionaryGenerator shall report an error naming the pattern or full path, and
                  generate no output, when any input pattern matches no file or a literal file or
                  directory does not exist.
                justification: |
                  A missing input must never silently produce an empty or partial glossary.
                tests:
                  - DictionaryGenerator_Generate_MissingInputs_ReportErrors
                  - DictionaryGenerator_Generate_OneMissingPattern_Fails

              - id: DictionaryMark-DictionaryGenerator-RichEntries
                title: >-
                  The DictionaryGenerator shall omit invisible entries from the output, and shall
                  report an error naming the term and file for an approved entry without a definition.
                justification: |
                  Hidden entries are machine-only; a definition is required for every approved term.
                tests:
                  - DictionaryGenerator_Generate_HiddenEntry_OmittedFromOutput
                  - DictionaryGenerator_Generate_HiddenEntryWithoutDefinition_ReportsError

              - id: DictionaryMark-DictionaryGenerator-DeprecatedKind
                title: >-
                  The DictionaryGenerator shall generate a deprecated-terms table or bullet list when
                  the kind is deprecated.
                justification: |
                  Deprecated terms are published like approved terms. Approved-versus-deprecated
                  conflicts are enforced by Ste100Mark.
                tests:
                  - DictionaryGenerator_Generate_DeprecatedKind_WritesTable
                  - DictionaryGenerator_Generate_DeprecatedKindCustomHeaders_AreUsed

              - id: DictionaryMark-DictionaryGenerator-TableJobs
                title: >-
                  The DictionaryGenerator shall generate the output of every job, each from its own inputs and
                  formatting, detecting conflicts within each job separately.
                justification: |
                  Configuration files define several independent tables, which may legitimately use different or
                  overlapping dictionaries.
                tests:
                  - DictionaryGenerator_Generate_MultipleJobs_WritesEachOutput
                  - DictionaryGenerator_Generate_ConflictsDetectedPerJob

              - id: DictionaryMark-DictionaryGenerator-JobErrors
                title: >-
                  The DictionaryGenerator shall continue with the remaining jobs after a job fails, prefix each
                  configuration-job error with the job index and output, and report how many table jobs failed.
                justification: |
                  Reporting every failure in one run, attributed to its job, saves repeated fix-and-retry cycles.
                tests:
                  - DictionaryGenerator_Generate_OneJobFails_ContinuesAndReportsJobLabel
                  - DictionaryGenerator_Generate_JobsFailed_WritesSummaryAndExitCodeOne

              - id: DictionaryMark-DictionaryGenerator-JobPaths
                title: >-
                  The DictionaryGenerator shall resolve each job's relative input patterns and relative output
                  path against the job's base directory.
                justification: |
                  Configuration-file and root-relative paths must not depend on the working directory.
                tests:
                  - DictionaryGenerator_Generate_JobBaseDirectory_ResolvesRelativeInputsAndOutput

              - id: DictionaryMark-DictionaryGenerator-OutputDirectories
                title: The DictionaryGenerator shall create missing parent directories of an output file.
                justification: |
                  Output is usually written into build folders that do not yet exist in a clean checkout.
                tests:
                  - DictionaryGenerator_Generate_OutputInMissingDirectory_CreatesDirectory

              - id: DictionaryMark-DictionaryGenerator-ColumnWidths
                title: The DictionaryGenerator shall format each job's output with that job's column widths.
                justification: |
                  Column widths are part of a job's formatting and must reach the formatter unchanged.
                tests:
                  - DictionaryGenerator_Generate_ColumnWidths_AppliedToOutput

              - id: DictionaryMark-DictionaryGenerator-FileAccessInputs
                title: >-
                  The DictionaryGenerator shall read every file a configuration-file table job's input patterns
                  match through one file-access resolver per job, whose base directory is the configuration file's
                  folder, shall hand each literal input pattern (one without wildcard characters) to the resolver
                  without looking it up first, reporting one that the resolver does not find as an input file that was
                  not found, shall parse the bytes the resolver returned, shall fail the job at the first refused match
                  (never skipping it) with a file-access-denied error naming the file and the policy when the policy
                  denies it or cannot be applied, or with a read error for any other refusal (including a file larger
                  than 16 MiB), and shall read the inputs of the command-line job by name without judging them, except
                  as required by DictionaryMark-DictionaryGenerator-FileAccessConfigRoot.
                justification: |
                  Every match of a glob is a file the configuration file chose; skipping a denied match would silently
                  produce a partial dictionary, and the policy must see the file that is actually parsed. Looking a
                  literal input up before the policy judges it would reveal whether a file outside the allowed
                  folders exists.
                tests:
                  - DictionaryGenerator_Generate_ConfigInputOutsideRoots_FileAccessDenied
                  - DictionaryGenerator_Generate_ConfigLiteralInputOutsideRoots_DeniedWithoutLookup
                  - DictionaryGenerator_Generate_ConfigLiteralMissingInputInsideRoots_ReportsNotFound
                  - DictionaryGenerator_Generate_ConfigGlobMatchOutsideRoots_IsDeniedNotSkipped
                  - DictionaryGenerator_Generate_ConfigGlobMatchThroughLinkUnderNoSymlinks_FileAccessDenied
                  - DictionaryGenerator_Generate_ConfigInputOverSizeLimit_ReadError
                  - DictionaryGenerator_Generate_CommandLineJob_IsNeverJudged

              - id: DictionaryMark-DictionaryGenerator-FileAccessOutputs
                title: >-
                  The DictionaryGenerator shall check the output path of a configuration-file table job with the
                  job's file-access resolver before creating any folder or writing the file, giving the resolver the
                  path with variables expanded and rooted at the job's base directory as text, before normalization,
                  and using the normalized path only for the write, shall fail the job with
                  a file-access-denied error when the policy denies it or cannot be applied, or with a write error for
                  any other refusal, and shall still run the other jobs.
                justification: |
                  A refused output must leave no trace on disk, and one refused job must not hide the results of the
                  others. Normalization can turn a network path into a local one (on Linux and macOS a leading // is
                  collapsed to /), so the resolver must see the path before it is normalized.
                tests:
                  - DictionaryGenerator_Generate_ConfigOutputOutsideRoots_DeniedAndNothingCreated
                  - DictionaryGenerator_Generate_ConfigNeverListOutputUnderAny_RefusedWithoutAccess
                  - DictionaryGenerator_Generate_ConfigNetworkOutput_RefusedBeforeNormalization
                  - DictionaryGenerator_Generate_ConfigNetworkRootRelativeOutput_RefusedBeforeNormalization
                  - DictionaryGenerator_Generate_DeniedJob_OtherJobsRunAndExitCodeIsOne

              - id: DictionaryMark-DictionaryGenerator-FileAccessPatterns
                title: >-
                  The DictionaryGenerator shall check every input pattern of a configuration-file table job, rooted
                  at the job's base directory as text before normalization and with variables expanded exactly as it
                  would be listed (and again with its relative segments collapsed), against the file-access
                  resolver's path-text refusals before any folder is listed, shall fail only that job with an error
                  naming the pattern and the broken rule when a pattern is refused, and shall not check the input
                  patterns of the command-line job, except as required by
                  DictionaryMark-DictionaryGenerator-FileAccessConfigRoot.
                justification: |
                  A pattern such as //host/share/*.yaml would contact the host while it is listed, before any match
                  reaches the resolver; refusing it first means no connection is made and no credentials can leak.
                tests:
                  - DictionaryGenerator_Generate_ConfigNetworkPatternForwardSlashes_RefusedBeforeListing
                  - "windows@DictionaryGenerator_Generate_ConfigNetworkPatternBackslashesOnWindows_RefusedBeforeListing"
                  - DictionaryGenerator_Generate_ConfigUrlPattern_RefusedBeforeListing
                  - DictionaryGenerator_Generate_ConfigNetworkRootRelativeInput_RefusedBeforeNormalization
                  - "windows@DictionaryGenerator_Generate_ConfigDeviceNamePatternOnWindows_RefusedBeforeListing"
                  - DictionaryGenerator_Generate_CommandLineJob_IsNeverJudged

              - id: DictionaryMark-DictionaryGenerator-FileAccessConfigRoot
                title: >-
                  The DictionaryGenerator shall judge each relative input pattern and the relative output path of a
                  command-line job whose base directory is the configuration file's root key exactly as it judges those
                  of a configuration-file table job - each literal input handed to the job's file-access resolver
                  before any lookup, every glob match read through it, each pattern checked against the never list
                  before any folder is listed, and the output checked before anything is created - shall fail the job
                  with a file-access-denied error and write nothing when the policy denies a path, and shall keep
                  reading absolute inputs and writing an absolute output of the same job by name without judging them.
                justification: |
                  A relative path that the root key of an untrusted configuration file moved is untrusted content, while
                  an absolute path names what the person running the tool chose; judging each path by whether the root
                  key moved it closes the redirection without restricting the trusted paths, even in one job that mixes
                  both.
                tags: [security]
                tests:
                  - DictionaryGenerator_Generate_ConfigRootRelocatedInputOutsideRoots_FileAccessDenied
                  - DictionaryGenerator_Generate_ConfigRootRelocatedLiteralInputOutsideRoots_DeniedWithoutLookup
                  - DictionaryGenerator_Generate_ConfigRootRelocatedGlobMatchOutsideRoots_IsDeniedNotSkipped
                  - DictionaryGenerator_Generate_ConfigRootRelocatedOutputOutsideRoots_DeniedAndNothingCreated
                  - DictionaryGenerator_Generate_ConfigRootRelocatedPathsInsideRoots_AreGenerated
                  - DictionaryGenerator_Generate_ConfigRootRelocatedAbsolutePaths_StayTrusted
                  - DictionaryGenerator_Generate_RootFlagWithConfigRoot_PathsStayTrusted
                  - DictionaryGenerator_Generate_ConfigRootRelocatedNetworkRoot_RefusedBeforeNormalization
                  - DictionaryGenerator_Generate_ConfigRootRelocatedInputThroughLinkUnderNoSymlinks_FileAccessDenied
                  - DictionaryGenerator_Generate_ConfigRootRelocatedInputUnderAny_IsRead

              - id: DictionaryMark-DictionaryGenerator-WrittenPathMessages
                title: >-
                  The DictionaryGenerator shall show a judged path - an input or output of a configuration-file table
                  job, or a relative path of a command-line job that the configuration file's root key relocates - in
                  its messages as written: a literal input as the pattern was written, a glob match relative to the
                  job's base directory with / separators (in full when the pattern itself is absolute), an output as it
                  was written, and a pattern refused by a never-list rule as written rather than expanded and rooted;
                  shall replace the full path of a judged file in YAML, conflict and write-failure messages by that
                  text; shall keep the file-access-denied keyword, the hint and the table job label; and shall keep the
                  full path in the messages of a trusted path.
                justification: |
                  A judged path comes from untrusted content whose author may read the messages. Showing it as written
                  tells the author which entry failed and nothing about the directories of the machine that ran the tool.
                tags: [security]
                tests:
                  - DictionaryGenerator_Generate_ConfigInputOutsideRoots_MessageShowsWrittenPath
                  - DictionaryGenerator_Generate_ConfigGlobMatchOutsideRoots_MessageShowsMatchRelativeToBase
                  - DictionaryGenerator_Generate_ConfigOutputOutsideRoots_MessageShowsWrittenPath
                  - DictionaryGenerator_Generate_ConfigNetworkRootPattern_MessageShowsWrittenPattern
                  - DictionaryGenerator_Generate_RootRelocatedCommandLineInputDenied_MessageShowsWrittenPath
                  - DictionaryGenerator_Generate_ConfigInputsConflict_MessageShowsWrittenPaths
                  - DictionaryGenerator_Generate_ConfigOutputWriteFailure_MessageShowsWrittenPath
                  - DictionaryGenerator_Generate_ConfigLiteralMissingInputInsideRoots_ReportsNotFound
                  - DictionaryGenerator_Generate_MalformedYaml_ContinuesWithLaterJob
                  - DictionaryGenerator_Generate_ConfigInputOverSizeLimit_ReadError
                  - DictionaryGenerator_Generate_TrustedAbsoluteInputMissing_MessageKeepsFullPath
