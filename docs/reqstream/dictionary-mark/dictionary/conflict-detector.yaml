---
# DictionaryMark ConflictDetector unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Dictionary Requirements
        sections:
          - title: ConflictDetector Requirements
            requirements:
              - id: DictionaryMark-ConflictDetector-Detect
                title: The ConflictDetector class shall detect terms with conflicting definitions across multiple files.
                justification: |
                  When merging dictionaries from multiple sources, conflicting definitions must be
                  detected and reported so users can resolve ambiguities before publishing.
                tests:
                  - ConflictDetector_Detect_NoEntries_ReturnsEmpty
                  - ConflictDetector_Detect_UniqueTerms_ReturnsEmpty
                  - ConflictDetector_Detect_ExactDuplicate_ReturnsEmpty
                  - ConflictDetector_Detect_SameTermDifferentDefinition_ReturnsConflict
                  - ConflictDetector_Detect_CaseInsensitiveConflict_Detected
                  - ConflictDetector_Detect_MultipleConflicts_ReturnsAll

              - id: DictionaryMark-ConflictDetector-CaseInsensitive
                title: The ConflictDetector class shall compare terms case-insensitively when detecting conflicts.
                justification: |
                  Dictionary terms may appear in different cases across source files. Case-insensitive
                  comparison ensures that "Term" and "term" are treated as the same term.
                tests:
                  - ConflictDetector_Detect_CaseInsensitiveConflict_Detected

              - id: DictionaryMark-ConflictDetector-Deduplication
                title: >-
                  The ConflictDetector class shall treat identical term-definition pairs as allowed
                  duplicates, not conflicts.
                justification: |
                  The same entry may appear in multiple source files (e.g., a shared term). Exact
                  duplicates (same term, same definition) are not conflicts and must not be reported.
                tests:
                  - ConflictDetector_Detect_ExactDuplicate_ReturnsEmpty

              - id: DictionaryMark-ConflictDetector-NullRejection
                title: The ConflictDetector class shall throw ArgumentNullException when the entries argument is null.
                justification: |
                  Null input is a programming error that should be detected immediately at the API
                  boundary rather than causing a NullReferenceException deeper in the call stack.
                tests:
                  - ConflictDetector_Detect_NullEntries_ThrowsArgumentNullException

              - id: DictionaryMark-ConflictDetector-FieldWise
                title: >-
                  The ConflictDetector class shall report a conflict when entries for the same term
                  differ in definition, pos, variants or visible, naming the term, the differing fields
                  and both source paths, independent of input order.
                justification: |
                  Every consumer of the shared glossary must apply the same rule so that a term has one
                  unambiguous meaning; naming both files lets the author resolve the conflict.
                tests:
                  - ConflictDetector_Detect_IdenticalRichEntries_ReturnsEmpty
                  - ConflictDetector_Detect_DifferingField_ReportsFieldAndBothSources
                  - ConflictDetector_Detect_SeveralFields_ListsInFixedOrder
                  - ConflictDetector_Detect_InputOrder_DoesNotChangeResult
                  - ConflictDetector_Detect_HiddenEntry_StillConflicts
                  - ConflictDetector_Detect_NoSource_RendersUnknown

              - id: DictionaryMark-ConflictDetector-Deprecated
                title: >-
                  The ConflictDetector class shall report a conflict when deprecated entries for the
                  same term differ in use or where, and when a term or an approved variant is both
                  approved and deprecated.
                justification: |
                  A term cannot be both approved and deprecated, and two deprecation records for one
                  term must agree.
                tests:
                  - ConflictDetector_Detect_DeprecatedDiffer_ReportsUseAndWhere
                  - ConflictDetector_Detect_DeprecatedIdentical_ReturnsEmpty
                  - ConflictDetector_Detect_ApprovedAndDeprecated_ReportsConflict
                  - ConflictDetector_Detect_VariantDeprecated_ReportsConflict
