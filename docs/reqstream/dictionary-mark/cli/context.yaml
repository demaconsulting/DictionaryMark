---
# DictionaryMark Context unit requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Cli Requirements
        sections:
          - title: Context Requirements
            requirements:
              - id: DictionaryMark-Context-ArgumentParsing
                title: The Context class shall parse command-line arguments into structured properties.
                justification: |
                  Provides a standardized approach to command-line argument parsing across all
                  DEMA Consulting DotNet Tools.
                tests:
                  - Context_Create_NoArguments_ReturnsDefaultContext
                  - Context_Create_InputFlag_AddsPattern
                  - Context_Create_MultipleInputFlags_AddsAllPatterns
                  - Context_Create_OutputFlag_SetsOutputFile
                  - Context_Create_FormatFlag_Table_SetsTableFormat
                  - Context_Create_FormatFlag_Bullets_SetsBulletsFormat
                  - Context_Create_SectionFlag_SetsSectionHeading
                  - Context_Create_TermHeaderFlag_SetsTermHeader
                  - Context_Create_DefinitionHeaderFlag_SetsDefinitionHeader
                  - Context_Create_SortFlag_Alpha_SetsAlphabetical
                  - Context_Create_SortFlag_File_SetsFileOrder

              - id: DictionaryMark-Context-HelpFlag
                title: The Context class shall parse the --help (-h, -?) flags and set the Help property to true.
                justification: |
                  The help flag must be recognized and routed to the correct display path
                  by Program.Run so users can discover available options.
                tests:
                  - Context_Create_HelpFlag_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_H_SetsHelpTrue
                  - Context_Create_ShortHelpFlag_Question_SetsHelpTrue

              - id: DictionaryMark-Context-ValidateFlag
                title: The Context class shall parse the --validate flag and set the Validate property to true.
                justification: |
                  The validate flag must be recognized so that Program.Run can route execution
                  to the self-validation workflow.
                tests:
                  - Context_Create_ValidateFlag_SetsValidateTrue

              - id: DictionaryMark-Context-ResultsFlag
                title: >-
                  The Context shall accept a --results / --result flag specifying the path
                  to write validation results.
                justification: |
                  The results file path must be captured so the self-validation subsystem can
                  write structured output for CI/CD pipeline consumption.
                tests:
                  - Context_Create_ResultsFlag_SetsResultsFile
                  - Context_Create_ResultAliasFlag_SetsResultsFile

              - id: DictionaryMark-Context-ResultsFlagMissing
                title: >-
                  The Context shall throw an exception when the --results / --result flag
                  is provided without a value.
                justification: |
                  Providing a clear error when the flag value is missing prevents silent
                  misconfiguration and guides users to supply the required file path.
                tests:
                  - Context_Create_ResultsFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ResultAliasFlag_WithoutValue_ThrowsArgumentException

              - id: DictionaryMark-Context-DepthFlag
                title: The Context class shall parse the --depth flag value as the heading depth for Markdown output.
                justification: |
                  Configurable heading depth is required to allow generated sections to integrate
                  into existing document hierarchies at the correct heading level.
                tests:
                  - Context_Create_DepthFlag_SetsHeadingDepth
                  - Context_Create_DepthFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_NonIntegerValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_ZeroValue_ThrowsArgumentException
                  - Context_Create_DepthFlag_ExceedsMaxValue_ThrowsArgumentException

              - id: DictionaryMark-Context-InvalidArgs
                title: The Context class shall reject unknown or malformed command-line arguments with a descriptive error.
                justification: |
                  Providing clear feedback for invalid arguments helps users quickly correct mistakes.
                tests:
                  - Context_Create_UnknownArgument_ThrowsArgumentException
                  - Context_Create_InputFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_OutputFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_FormatFlag_InvalidValue_ThrowsArgumentException
                  - Context_Create_SortFlag_InvalidValue_ThrowsArgumentException

              - id: DictionaryMark-Context-VersionFlag
                title: The Context class shall parse the --version (-v) flag and set the Version property to true.
                justification: |
                  The version flag must be recognized and routed to the correct display path
                  by Program.Run.
                tests:
                  - Context_Create_VersionFlag_SetsVersionTrue
                  - Context_Create_ShortVersionFlag_SetsVersionTrue

              - id: DictionaryMark-Context-SilentFlag
                title: The Context class shall parse the --silent flag and set the Silent property to true.
                justification: |
                  Silent mode must be applied uniformly to all output so that automated pipelines
                  receive no unexpected console output from the tool.
                tests:
                  - Context_Create_SilentFlag_SetsSilentTrue
                  - Context_WriteLine_Silent_DoesNotWriteToConsole
                  - Context_WriteError_Silent_DoesNotWriteToConsole

              - id: DictionaryMark-Context-LogFlag
                title: The Context class shall parse the --log flag and open the specified file for log output.
                justification: |
                  Log files provide a persistent record of tool output for debugging and
                  compliance audit trails.
                tests:
                  - Context_Create_LogFlag_OpensLogFile
                  - Context_WriteError_WritesToLogFile

              - id: DictionaryMark-Context-KindOptions
                title: >-
                  The Context class shall parse the --kind (terms or deprecated), --use-header,
                  --where-header options, track whether --term-header was supplied, and reject an invalid --kind value.
                justification: |
                  The deprecated-terms output needs its own selector and column headers.
                tests:
                  - Context_Create_Defaults_KindTermsAndHeaders
                  - Context_Create_DeprecatedOptions_AreParsed
                  - Context_Create_InvalidKind_ThrowsArgumentException

              - id: DictionaryMark-Context-ColumnWidthsOption
                title: >-
                  The Context class shall parse the --column-widths option as 2 or 3 comma-separated positive
                  integers and reject zero, negative, non-integer, empty and wrongly counted values.
                justification: |
                  Column widths are typed by users on the command line, so syntax errors must be reported with
                  a clear message before any work is done.
                tests:
                  - Context_Create_ColumnWidthsFlag_SetsColumnWidths
                  - Context_Create_ColumnWidthsFlag_InvalidValue_ThrowsArgumentException
                  - Context_Create_ColumnWidthsFlag_WithoutValue_ThrowsArgumentException
                  - Context_Create_ColumnWidthsCountMismatch_ThrowsArgumentException

              - id: DictionaryMark-Context-ConfigOption
                title: >-
                  The Context class shall accept --config at most once, resolve it against the working directory
                  with ${VAR} expansion, load the file, create one job per table, and reject --input or --output
                  when the file defines tables.
                justification: |
                  The configuration file must be located the same way regardless of any root directory, and the
                  generation jobs must be fully determined before any job runs.
                tests:
                  - Context_Create_ConfigFlag_LoadsTableJobs
                  - Context_Create_ConfigFlagTwice_ThrowsArgumentException
                  - Context_Create_ConfigWithTablesAndInput_ThrowsArgumentException
                  - Context_Create_ConfigWithTablesAndOutput_ThrowsArgumentException
                  - Context_Create_ConfigWithoutTables_AppliesDefaultsToCommandLineJob
                  - Context_Create_ConfigPathEnvironmentVariable_Expanded

              - id: DictionaryMark-Context-ExplicitOptions
                title: >-
                  The Context class shall record the formatting options given explicitly on the command line as
                  the highest-precedence formatting layer, leaving options that were not given unset.
                justification: |
                  Only options the user actually typed may override the configuration file; recording built-in
                  defaults as if they were given would hide the file's values.
                tests:
                  - Context_Create_FormattingFlags_RecordedAsCommandLineLayer
                  - Context_Create_NoFormattingFlags_CommandLineLayerEmpty

              - id: DictionaryMark-Context-RootOption
                title: >-
                  The Context class shall accept --root <dir> at most once and with a non-empty value, and shall
                  resolve it against the working directory, expanding ${VAR} and normalizing parent-directory
                  segments, rejecting a directory that does not exist.
                justification: |
                  The root directory is the base for every relative path, so it must be unambiguous and must
                  exist before any job runs.
                tests:
                  - Context_Create_RootFlag_SetsRootDirectory
                  - Context_Create_RootFlagRelativeWithParentSegments_ResolvedAgainstWorkingDirectory
                  - Context_Create_RootFlagEnvironmentVariable_Expanded
                  - Context_Create_RootFlagMissingDirectory_ThrowsInvalidOperationException
                  - Context_Create_RootFlagTwice_ThrowsArgumentException
                  - Context_Create_RootFlagWithoutValue_ThrowsArgumentException
                  - Context_Create_RootFlagEmpty_ThrowsArgumentException

              - id: DictionaryMark-Context-BaseDirectorySelection
                title: >-
                  The Context class shall give every job the base directory --root, else the configuration file
                  root key, else the configuration file's directory for table jobs and the working directory for
                  the command-line job, and shall not resolve --config against the root.
                justification: |
                  Selecting the base directory in one place guarantees the documented precedence for every job.
                tests:
                  - Context_Create_RootFlag_AppliedToCommandLineJob
                  - Context_Create_RootFlag_AppliedToConfigTables
                  - Context_Create_RootFlag_OverridesConfigRoot
                  - Context_Create_ConfigRoot_AppliedToConfigTables
                  - Context_Create_ConfigRoot_AppliedToCommandLineJob
                  - Context_Create_NoRoot_ConfigTablesUseConfigDirectory
                  - Context_Create_NoRoot_CommandLineJobUsesWorkingDirectory
                  - Context_Create_RootFlag_ConfigPathNotResolvedAgainstRoot

              - id: DictionaryMark-Context-ConfigRootTrust
                title: >-
                  The Context class shall mark the command-line job as one whose relative paths the configuration
                  file's root key relocates only when no --root option is given and the configuration file has a root
                  key, and shall give that job the root's text before normalization as its base directory text, so
                  that the file-access resolver's text rules see a root key such as //host/share as written; with a
                  --root option, without a root key and without a configuration file the command-line job shall not
                  be marked.
                justification: |
                  Only a path that an untrusted configuration file moved needs the file-access check; marking exactly
                  those jobs keeps the paths the person running the tool chose trusted, and the unnormalized root text
                  keeps a network root from being collapsed into a local path before it is refused.
                tags: [security]
                tests:
                  - Context_Create_ConfigRootWithoutTables_CommandLineJobPathsAreJudged
                  - Context_Create_ConfigRootAndRootFlag_CommandLineJobStaysTrusted
                  - Context_Create_ConfigWithoutRoot_CommandLineJobStaysTrusted
                  - Context_Create_ConfigRoot_CommandLineJobKeepsRootTextBeforeNormalization

              - id: DictionaryMark-Context-ConfigEnvironmentMode
                title: >-
                  The Context class shall load the configuration file with ${VAR} references in its root, input and
                  output paths refused exactly when the file-access policy it built is not the allow-all policy - that
                  is, for the roots, no-symlinks and roots,no-symlinks modes and for --allow-root, which implies roots -
                  and allowed when no file-access option is given or the mode is any, and shall expand ${VAR} in the
                  --config, --root, --input and --output paths in every mode.
                justification: |
                  Only the configuration file's content is untrusted; deciding the mode in one place, from the policy
                  that is actually built, keeps every spelling of a restrictive mode (including the one implied by
                  --allow-root) covered, and keeps the paths the person running the tool typed working.
                tags: [security]
                tests:
                  - Context_Create_RestrictiveModeWithEnvironmentOutput_ThrowsWithoutLeak
                  - Context_Create_RestrictiveModeWithEnvironmentInput_ThrowsWithoutLeak
                  - Context_Create_RestrictiveModeWithEnvironmentRoot_ThrowsWhetherDefinedOrNot
                  - Context_Create_RootsWithEnvironmentRootAndCommandLinePaths_Throws
                  - Context_Create_AnyModeWithEnvironmentConfigPaths_Expands
                  - Context_Create_RootsWithCommandLineEnvironmentPaths_StillExpanded

              - id: DictionaryMark-Context-FileAccessOptions
                title: >-
                  The Context class shall parse the --file-access option (keeping the value of its last occurrence)
                  and the repeatable --allow-root option, and shall build from them, before the configuration file is
                  loaded, the file-access policy of the run: any (the default) allows every file, roots confines to
                  folders, no-symlinks refuses links, roots,no-symlinks applies both (tokens in any order and letter
                  case), and --allow-root alone implies roots with the named folders (a relative folder taken from the
                  working directory) replacing the default folders; it shall reject with ArgumentException an unknown
                  or repeated token, --allow-root with any or no-symlinks, and an --allow-root folder that does not
                  exist, with messages that name the mistake and how to fix it.
                justification: |
                  The options must mean exactly what CanvasNet's options of the same name mean, and every mistake
                  must be reported before any input is read.
                tests:
                  - Context_ReadFileAccess_WithoutOptions_IsAllowAll
                  - Context_ReadFileAccess_EachMode_BuildsItsPolicy
                  - Context_ReadFileAccess_InvalidMode_IsUsageErrorListingTheModes
                  - Context_ReadFileAccess_AllowRootAlone_ConfinesToTheNamedFolders
                  - Context_ReadFileAccess_AllowRootWithAnyOrNoSymlinks_IsUsageErrorNamingTheConflict
                  - Context_ReadFileAccess_AllowRootThatDoesNotExist_IsUsageError
                  - Context_Create_NoFileAccessOptions_IsAllowAll
                  - Context_Create_FileAccessRepeated_LastValueWins
                  - Context_Create_AllowRootRepeated_AllFoldersAllowed
                  - Context_Create_FileAccessMistake_ReportedBeforeConfigIsLoaded

              - id: DictionaryMark-Context-FileAccessDefaultRoots
                title: >-
                  The Context class shall, for the roots mode without --allow-root, allow the working directory and
                  the folder of the configuration file when it is not the working directory or inside it, once each.
                justification: |
                  A configuration file usually lives in the repository being built; its folder and the folder the
                  user runs from are the natural default boundary.
                tests:
                  - Context_DefaultRoots_AreTheWorkingDirectoryAndEachInputFolderOutsideIt
                  - Context_ReadFileAccess_RootsWithoutAllowRoot_UsesTheDefaultRoots
                  - Context_Create_RootsWithConfig_DefaultRootsIncludeConfigFolder
