---
# DictionaryMark FileAccessPolicy unit requirements
#
# These requirements describe the behavior of the FileAccessPolicy unit of the Files subsystem: the policy that
# decides whether a file a configuration file names may be read or written, with its built-in policies (any, roots,
# no-symlinks and their combination), together with its FileAccessRequest and FileAccessDecision types. The unit is
# adapted from CanvasNet's FileAccessPolicy.

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Files Requirements
        sections:
          - title: FileAccessPolicy Requirements
            requirements:
              - id: DictionaryMark-FileAccessPolicy-AllowAll
                title: >-
                  The FileAccessPolicy class shall provide a policy named "any" that allows every file and needs no
                  real path.
                justification: |
                  The default behaves like Pandoc: a configuration file may reference any regular local file, and the
                  default must work where the real path of an open file cannot be determined.
                tests:
                  - FileAccessPolicy_AllowAll_AnyRequest_IsAllowedAndNamedAny

              - id: DictionaryMark-FileAccessPolicy-UnderRoots
                title: >-
                  The FileAccessPolicy class shall provide a policy named "roots" that allows a file only when both
                  the path as written and the real path lie inside one of the given folders (the folder itself
                  included, a sibling that merely shares a name prefix excluded, the path as written compared under the
                  platform's case rule and in each folder's written and real spelling, the real path compared exactly
                  in the letter case stored on disk), that refuses a path as written outside every
                  folder before the file is opened, that compares the real path only with each folder's real location
                  captured when the policy is created (a folder that does not exist then allows no file), that explains
                  a denial with a reason and a hint, and that rejects a missing, empty or invalid folder, and on Windows
                  a folder in a device namespace other than an ordinary extended-length drive or volume path, when it is
                  created.
                justification: |
                  A build server confines configuration files to chosen folders; a link that stays inside is fine,
                  one that leads out is not, and a path outside the folders is never even opened. Looking a folder up
                  again later would let a folder renamed and replaced by a link widen the policy. A folder whose name
                  differs from an allowed folder only in letter case is a different folder on a case-sensitive file
                  system, which cannot be detected reliably, so the real path is compared exactly.
                tests:
                  - FileAccessPolicy_UnderRoots_RealPathInsideOrEqualToARoot_IsAllowed
                  - FileAccessPolicy_UnderRoots_SiblingWithSharedPrefix_IsDenied
                  - FileAccessPolicy_UnderRoots_RealPathOutsideEveryRoot_IsDeniedWithReasonAndHint
                  - FileAccessPolicy_UnderRoots_RootCreatedAfterThePolicy_AllowsNothing
                  - FileAccessPolicy_UnderRoots_WrittenPathOutsideEveryRoot_IsDeniedByThePreCheck
                  - FileAccessPolicy_UnderRoots_InvalidRoots_Throw
                  - FileAccessPolicy_UnderRoots_RealPathInOtherCase_IsMatchedByItsStoredCase

              - id: DictionaryMark-FileAccessPolicy-NoSymlinks
                title: >-
                  The FileAccessPolicy class shall provide a policy named "no-symlinks" that allows a file only when
                  its real path equals the path as written below the deepest folder shared by that path and the
                  request's base directory (the trusted, host-chosen folder the lookup started from), trusting that
                  folder and everything above it,                   comparing both exactly in the letter case stored on disk (except a Windows drive letter, which names
                  the same drive in either case), and comparing a path written with short (8.3) names in its long
                  spelling.
                justification: |
                  Some hosts refuse links altogether; folders the host chose (and their links, such as the macOS
                  temporary folder) are trusted, and a short spelling is not a link. A path written in another letter
                  case on a case-insensitive file system is not a link either.
                tests:
                  - FileAccessPolicy_NoSymlinks_RealPathMatchesTheWrittenPath_IsAllowed
                  - FileAccessPolicy_NoSymlinks_RealPathDiffersBelowTheAnchor_IsDenied
                  - FileAccessPolicy_NoSymlinks_LinkAboveTheAnchor_IsTrusted
                  - FileAccessPolicy_NoSymlinks_WrittenPathInOtherCase_IsMatchedByItsStoredCase
                  - "windows@FileAccessPolicy_NoSymlinks_DriveLetterInOtherCase_AnchorIsTheBaseDirectory"
                  - "windows@FileAccessPolicy_NoSymlinks_ShortNameSpelling_IsAllowed"

              - id: DictionaryMark-FileAccessPolicy-Combine
                title: >-
                  The FileAccessPolicy class shall combine policies into one that asks them in order and returns the
                  first denial, whose name joins the parts' names with a plus sign, that flattens nested
                  combinations, returns a single policy unchanged, needs a real path when any part does, and rejects
                  a missing, empty or null-holding list.
                justification: |
                  The roots,no-symlinks mode composes two rules without a policy of its own, and diagnostics must
                  name the composition.
                tests:
                  - FileAccessPolicy_Combine_FirstDenialWinsAndNamesAreJoined
                  - FileAccessPolicy_Combine_InvalidArguments_Throw

              - id: DictionaryMark-FileAccessPolicy-Decision
                title: >-
                  The FileAccessDecision class shall represent an allow decision as one shared instance and a denial
                  with a non-empty reason and an optional hint, rejecting a missing or empty reason.
                justification: |
                  A policy explains a denial in words that end up in the caller's diagnostic, without throwing.
                tests:
                  - FileAccessDecision_Deny_KeepsReasonAndHintAndRejectsAnEmptyReason
