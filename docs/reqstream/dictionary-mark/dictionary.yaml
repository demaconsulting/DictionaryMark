---
# DictionaryMark Dictionary subsystem requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Dictionary Requirements
        requirements:
          - id: DictionaryMark-Dictionary-YamlLoading
            title: The Dictionary subsystem shall load dictionary entries from YAML files.
            justification: |
              YAML loading is the foundational step of the dictionary pipeline; all subsequent
              processing depends on correctly parsed term-definition pairs.
            children:
              - DictionaryMark-YamlLoader-Load
              - DictionaryMark-YamlLoader-StructureErrors
              - DictionaryMark-YamlLoader-FileErrors
              - DictionaryMark-YamlLoader-NullInput
              - DictionaryMark-YamlLoader-DuplicateKeys
              - DictionaryMark-YamlLoader-RichEntries
              - DictionaryMark-YamlLoader-DefinitionRequired
              - DictionaryMark-YamlLoader-FieldValidation
              - DictionaryMark-YamlLoader-Deprecated
            tests:
              - DictionarySubsystem_BulletGeneration_ValidYaml_GeneratesBulletMarkdown
              - DictionarySubsystem_TableGeneration_ValidYaml_GeneratesTableMarkdown

          - id: DictionaryMark-Dictionary-ConflictDetection
            title: The Dictionary subsystem shall detect and report conflicting definitions across input files.
            justification: |
              Conflict detection prevents incorrect documentation from being generated when the
              same term has different definitions in different source files.
            children:
              - DictionaryMark-ConflictDetector-Detect
              - DictionaryMark-ConflictDetector-CaseInsensitive
              - DictionaryMark-ConflictDetector-Deduplication
              - DictionaryMark-ConflictDetector-NullRejection
              - DictionaryMark-ConflictDetector-FieldWise
              - DictionaryMark-ConflictDetector-Deprecated
            tests:
              - DictionarySubsystem_ConflictDetection_ConflictingEntries_ReturnsConflicts

          - id: DictionaryMark-Dictionary-MarkdownFormatting
            title: The Dictionary subsystem shall format dictionary entries as Markdown output.
            justification: |
              Markdown formatting is the final output stage of the dictionary pipeline, converting
              loaded and validated entries into the output format requested by the user.
            children:
              - DictionaryMark-Formatter-Bullets
              - DictionaryMark-Formatter-Table
              - DictionaryMark-Formatter-SectionHeading
              - DictionaryMark-Formatter-Sorting
              - DictionaryMark-Formatter-Deduplication
              - DictionaryMark-Formatter-HiddenEntries
              - DictionaryMark-Formatter-Deprecated
            tests:
              - DictionarySubsystem_BulletGeneration_ValidYaml_GeneratesBulletMarkdown
              - DictionarySubsystem_TableGeneration_ValidYaml_GeneratesTableMarkdown

          - id: DictionaryMark-Dictionary-Generation
            title: The Dictionary subsystem shall orchestrate the end-to-end dictionary generation pipeline.
            justification: |
              Orchestration is needed to coordinate file loading, conflict detection, and output
              formatting into a single coherent generation operation.
            children:
              - DictionaryMark-DictionaryGenerator-FileLoading
              - DictionaryMark-DictionaryGenerator-ConflictReporting
              - DictionaryMark-DictionaryGenerator-OutputRouting
              - DictionaryMark-DictionaryGenerator-StrictInputs
              - DictionaryMark-DictionaryGenerator-RichEntries
              - DictionaryMark-DictionaryGenerator-DeprecatedKind
              - DictionaryMark-DictionaryGenerator-OutputDirectories
            tests:
              - DictionarySubsystem_Generation_ValidYaml_GeneratesMarkdown

          - id: DictionaryMark-Dictionary-ColumnWidths
            title: >-
              The Dictionary subsystem shall size generated table columns in proportion to the requested column
              widths, rescaling for deprecated tables without a Where column.
            justification: |
              Proportional columns keep long definitions readable when tables are rendered to fixed-width
              pages.
            children:
              - DictionaryMark-Formatter-ColumnWidths
              - DictionaryMark-Formatter-ColumnWidthsDeprecated
              - DictionaryMark-DictionaryGenerator-ColumnWidths
            tests:
              - DictionarySubsystem_TableGeneration_ColumnWidths_GeneratesProportionalSeparator

          - id: DictionaryMark-Dictionary-TableJobs
            title: >-
              The Dictionary subsystem shall generate one output per job, resolving each job's paths against its
              base directory and reporting failures per job without stopping the remaining jobs.
            justification: |
              Configuration files define several independent tables that must all be generated and diagnosed
              in one run.
            children:
              - DictionaryMark-DictionaryGenerator-TableJobs
              - DictionaryMark-DictionaryGenerator-JobErrors
              - DictionaryMark-DictionaryGenerator-JobPaths
            tests:
              - DictionarySubsystem_Generation_MultipleJobs_GeneratesEachOutput

          - id: DictionaryMark-Dictionary-FileAccess
            title: >-
              The Dictionary subsystem shall read every input file of a configuration-file table job through the
              file-access policy of the run, parsing exactly the bytes the policy approved, shall refuse an input
              pattern that breaks a never-list rule before any of its folders is listed, shall check the job's
              output path by the same policy before creating anything, shall fail only that job when a path is
              refused (with a file-access-denied error when the policy denies it, or with a read or write error for
              any other refusal), and shall read and write the paths of the command-line job without judging them.
            justification: |
              The dictionary pipeline is where table inputs are read and outputs are written, so it is where the
              policy must be applied; a refusal must not stop the other jobs.
            children:
              - DictionaryMark-DictionaryGenerator-FileAccessInputs
              - DictionaryMark-DictionaryGenerator-FileAccessOutputs
              - DictionaryMark-DictionaryGenerator-FileAccessPatterns
              - DictionaryMark-YamlLoader-Content
            tests:
              - DictionarySubsystem_FileAccess_ConfigJobOutsideRoots_DeniedAndOtherJobsRun
              - DictionarySubsystem_FileAccess_NetworkPattern_RefusedAndOtherJobsRun
