---
# DictionaryMark Cli subsystem requirements

sections:
  - title: DictionaryMark Requirements
    sections:
      - title: Cli Requirements
        requirements:
          - id: DictionaryMark-Cli-ArgumentParsing
            title: The CLI subsystem shall parse command-line arguments into structured Context properties.
            justification: |
              A dedicated argument-parsing layer ensures all tool interactions use the same
              consistent patterns for interpreting flags, values, and defaults.
            children:
              - DictionaryMark-Context-ArgumentParsing
              - DictionaryMark-Context-VersionFlag
              - DictionaryMark-Context-HelpFlag
              - DictionaryMark-Context-ValidateFlag
              - DictionaryMark-Context-ResultsFlag
              - DictionaryMark-Context-ResultsFlagMissing
              - DictionaryMark-Context-DepthFlag
              - DictionaryMark-Context-KindOptions
            tests:
              - CliSubsystem_VersionFlow_ContextAndProgram_DisplaysVersionAndExits
              - CliSubsystem_HelpFlow_ContextAndProgram_DisplaysHelpAndExits
              - CliSubsystem_ValidateFlow_ContextAndProgram_RunsValidationAndExits
              - CliSubsystem_InvalidArgs_ContextAndProgram_RejectsUnknownArgumentsAndExitsNonZero

          - id: DictionaryMark-Cli-OutputManagement
            title: The CLI subsystem shall manage console output, log file output, and silent-mode suppression.
            justification: |
              Centralized output management in Context ensures all subsystems write to the same
              channels and that silent mode and log files are applied uniformly.
            children:
              - DictionaryMark-Context-SilentFlag
              - DictionaryMark-Context-LogFlag
            tests:
              - CliSubsystem_SilentFlow_ContextAndProgram_SuppressesOutput
              - CliSubsystem_LogFlow_ContextAndProgram_WritesLogFile

          - id: DictionaryMark-Cli-ResultsFile
            title: The CLI subsystem shall write validation results to a file when a results file path is specified.
            justification: |
              Results file output allows integration with CI pipelines and test reporting tools
              by providing TRX or JUnit XML output of self-validation test runs.
            children:
              - DictionaryMark-Context-ResultsFlag
            tests:
              - CliSubsystem_ResultsFlow_ContextAndProgram_WritesResultsFile
              - CliSubsystem_ResultAliasFlow_ContextAndProgram_WritesResultsFile

          - id: DictionaryMark-Cli-HeadingDepth
            title: The CLI subsystem shall control the heading depth of generated Markdown output via the --depth flag.
            justification: |
              Configurable heading depth allows generated sections to integrate into existing
              document hierarchies at the correct heading level.
            children:
              - DictionaryMark-Context-DepthFlag
            tests:
              - CliSubsystem_DepthFlow_ContextAndProgram_AdjustsHeadingDepth

          - id: DictionaryMark-Cli-ErrorOutput
            title: The CLI subsystem shall write error messages to stderr on failure.
            justification: |
              Directing errors to stderr follows POSIX conventions and allows calling scripts
              to distinguish diagnostic messages from normal tool output.
            children:
              - DictionaryMark-Context-InvalidArgs
            tests:
              - CliSubsystem_ErrorOutput_ContextAndProgram_WritesErrorToStderr
              - CliSubsystem_InvalidArgs_ContextAndProgram_RejectsUnknownArgumentsAndExitsNonZero

          - id: DictionaryMark-Cli-ColumnWidthsOption
            title: >-
              The CLI subsystem shall accept relative table column widths and reject widths that are not 2 or 3
              positive integers or whose count does not match the effective table shape.
            justification: |
              The column widths must reach the formatter only when they describe the table being generated,
              so invalid values are reported before any output is written.
            children:
              - DictionaryMark-Context-ColumnWidthsOption
              - DictionaryMark-TableJob-ColumnWidthsCount
            tests:
              - CliSubsystem_ColumnWidthsFlow_ContextAndProgram_WritesProportionalTable
              - CliSubsystem_ColumnWidthsFlow_InvalidValue_ExitsNonZero

          - id: DictionaryMark-Cli-ConfigFile
            title: >-
              The CLI subsystem shall load a YAML configuration file given by the config option, providing
              formatting defaults and table jobs, and shall reject invalid files and conflicting command-line
              options with an error.
            justification: |
              The configuration file is a second source of run settings; the CLI subsystem owns all run
              settings, so it must read, validate and turn the file into generation jobs.
            children:
              - DictionaryMark-Context-ConfigOption
              - DictionaryMark-ConfigFile-Load
              - DictionaryMark-ConfigFile-InputForms
              - DictionaryMark-ConfigFile-FileErrors
              - DictionaryMark-ConfigFile-TablesStructure
              - DictionaryMark-ConfigFile-KeyValidation
              - DictionaryMark-ConfigFile-ValueValidation
              - DictionaryMark-ConfigFile-Root
              - DictionaryMark-TableJob-Identity
            tests:
              - CliSubsystem_ConfigFlow_TableJobs_GeneratesEachOutput
              - CliSubsystem_ConfigFlow_InvalidConfig_ExitsNonZero
              - CliSubsystem_ConfigFlow_TablesWithInput_ExitsNonZero

          - id: DictionaryMark-Cli-FormattingPrecedence
            title: >-
              The CLI subsystem shall determine each formatting setting from the command line, then the table job,
              then the configuration file defaults, then the built-in default.
            justification: |
              A single, predictable precedence lets users override shared configuration for one run and lets
              each job refine the shared defaults.
            children:
              - DictionaryMark-Context-ExplicitOptions
              - DictionaryMark-TableJob-Precedence
              - DictionaryMark-TableJob-DeprecatedTermHeader
              - DictionaryMark-TableJob-ColumnWidthsCount
            tests:
              - CliSubsystem_ConfigFlow_CommandLineOverride_AppliesToEveryJob

          - id: DictionaryMark-Cli-RootDirectory
            title: >-
              The CLI subsystem shall determine the base directory for relative input and output paths from the
              root option, then the configuration file root key, then the path's origin default, shall reject a
              root option naming a directory that does not exist, and shall resolve the configuration file root
              key as text only, without accessing the file system.
            justification: |
              A root directory lets users run the tool from any working directory with repository-relative
              paths; the CLI subsystem owns run settings, so it selects the base directory for every job. The
              root option is trusted command-line input, while the root key is untrusted configuration content
              that may only move where relative paths point.
            children:
              - DictionaryMark-Context-RootOption
              - DictionaryMark-Context-BaseDirectorySelection
              - DictionaryMark-ConfigFile-Root
            tests:
              - CliSubsystem_RootFlow_CommandLineRoot_ResolvesInputsAndOutput
              - CliSubsystem_RootFlow_ConfigRoot_ResolvesTableJobs
              - CliSubsystem_RootFlow_CommandLineRootOverridesConfigRoot_ResolvesTableJobs
              - CliSubsystem_RootFlow_MissingRoot_ExitsNonZero
              - CliSubsystem_RootFlow_NonexistentConfigRoot_FailsJobNotLoad

          - id: DictionaryMark-Cli-FileAccessOptions
            title: >-
              The CLI subsystem shall build one file-access policy per run from the file-access and allow-root
              options - the default allowing every file, the roots mode allowing the allow-root folders or, without
              them, the working directory and the configuration file's folder - before the configuration file is
              loaded, and shall reject an unknown mode, a conflicting combination and a folder that does not exist
              with an error.
            justification: |
              The CLI subsystem owns run settings; the file-access policy is one of them, and a mistake in it must
              stop the run before any input is opened.
            children:
              - DictionaryMark-Context-FileAccessOptions
              - DictionaryMark-Context-FileAccessDefaultRoots
            tests:
              - CliSubsystem_FileAccessFlow_AllowRoot_ConfinesConfigTableJobs
              - CliSubsystem_FileAccessFlow_InvalidOptions_ExitsNonZero
