---
# DictionaryMark system-level requirements

sections:
  - title: DictionaryMark Requirements
    requirements:
      - id: DictionaryMark-System-Version
        title: The tool shall display version information when the version flag is provided.
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification.
        tags: [system]
        children:
          - DictionaryMark-Program-Version
          - DictionaryMark-Cli-ArgumentParsing
        tests:
          - DictionaryMark_VersionFlag_Provided_OutputsVersion

      - id: DictionaryMark-System-Help
        title: The tool shall display usage information when the help flag is provided.
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources.
        tags: [system]
        children:
          - DictionaryMark-Program-Help
          - DictionaryMark-Cli-ArgumentParsing
        tests:
          - DictionaryMark_HelpFlag_Provided_OutputsUsageInformation

      - id: DictionaryMark-System-Validate
        title: The tool shall execute self-validation tests when the validate flag is provided.
        justification: |
          Regulated environments require tool qualification evidence to demonstrate
          that the tool functions correctly in its deployment environment.
        tags: [system]
        children:
          - DictionaryMark-Program-Validate
          - DictionaryMark-SelfTest-Subsystem
        tests:
          - DictionaryMark_ValidateFlag_Provided_RunsValidation

      - id: DictionaryMark-System-NoInputHint
        title: The tool shall display a usage hint when neither an action flag nor input patterns are provided.
        justification: |
          Invoking the tool with no arguments at all is a common first-run mistake. Displaying a
          helpful hint toward correct usage, rather than silently exiting or doing nothing,
          reduces user confusion without requiring the user to already know about --help.
        tags: [system]
        children:
          - DictionaryMark-Program-NoInputHint
        tests:
          - DictionaryMark_NoArguments_Invoked_DisplaysBanner

      - id: DictionaryMark-System-Silent
        title: The tool shall suppress console output when the silent flag is provided.
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs when only the exit code is needed.
        tags: [system]
        children:
          - DictionaryMark-Cli-OutputManagement
          - DictionaryMark-Cli-ArgumentParsing
        tests:
          - DictionaryMark_SilentFlag_Provided_SuppressesOutput

      - id: DictionaryMark-System-Log
        title: The tool shall write output to a log file when the log flag is provided.
        justification: |
          Provides persistent logging for debugging and compliance audit trails.
        tags: [system]
        children:
          - DictionaryMark-Cli-OutputManagement
          - DictionaryMark-Cli-ArgumentParsing
        tests:
          - DictionaryMark_LogFlag_Provided_WritesOutputToFile

      - id: DictionaryMark-System-ErrorHandling
        title: The tool shall return a non-zero exit code for unrecognized arguments.
        justification: |
          A non-zero exit code enables CI/CD pipelines to detect and surface
          misconfiguration failures automatically.
        tags: [system]
        children:
          - DictionaryMark-Cli-ErrorOutput
          - DictionaryMark-Program-ExitCode
        tests:
          - DictionaryMark_UnknownArgument_Provided_ReturnsError

      - id: DictionaryMark-System-ErrorHandling-Message
        title: >-
          The tool shall write an error message identifying the unrecognized argument
          to stderr when an unrecognized argument is provided.
        justification: |
          Clear error messages help users diagnose misconfiguration quickly.
        tags: [system]
        children:
          - DictionaryMark-Cli-ErrorOutput
        tests:
          - DictionaryMark_UnrecognizedArgument_WritesErrorToStderr

      - id: DictionaryMark-System-ErrorHandling-NoOutput
        title: The tool shall not write any Markdown content when an unrecognized argument is provided.
        justification: |
          Suppressing Markdown output on argument error prevents partial content
          from being written to downstream pipeline stages.
        tags: [system]
        children:
          - DictionaryMark-Cli-ErrorOutput
        tests:
          - DictionaryMark_UnrecognizedArgument_WritesNoMarkdownOutput

      - id: DictionaryMark-System-GenerateBullets
        title: The tool shall generate a Markdown bullet list from YAML dictionary files.
        justification: |
          The primary use case is generating a bullet-list dictionary from YAML input files
          for inclusion in documentation.
        tags: [system]
        children:
          - DictionaryMark-Program-GenerateDictionary
          - DictionaryMark-Dictionary-MarkdownFormatting
          - DictionaryMark-Dictionary-Generation
          - DictionaryMark-Dictionary-YamlLoading
        tests:
          - DictionaryMark_Generate_BulletsFormat_OutputsBulletList

      - id: DictionaryMark-System-GenerateTable
        title: The tool shall generate a Markdown table from YAML dictionary files when table format is requested.
        justification: |
          Table format provides an alternative presentation for users who prefer
          structured tabular layouts in their documentation.
        tags: [system]
        children:
          - DictionaryMark-Program-GenerateDictionary
          - DictionaryMark-Dictionary-MarkdownFormatting
          - DictionaryMark-Dictionary-Generation
          - DictionaryMark-Dictionary-YamlLoading
        tests:
          - DictionaryMark_Generate_TableFormat_OutputsTable

      - id: DictionaryMark-System-DeprecatedKind
        title: >-
          The tool shall generate a deprecated-terms table when the kind flag is set to deprecated.
        justification: |
          Documentation sets need a list of terms that must not be used, together with the
          preferred replacement and where the term applied, generated from the same YAML tooling
          as the approved glossary.
        tags: [system]
        children:
          - DictionaryMark-Context-KindOptions
          - DictionaryMark-DictionaryGenerator-DeprecatedKind
          - DictionaryMark-DictionaryGenerator-RichEntries
          - DictionaryMark-YamlLoader-Deprecated
          - DictionaryMark-Formatter-Deprecated
          - DictionaryMark-ConflictDetector-Deprecated
        tests:
          - DictionaryMark_Generate_DeprecatedKind_OutputsDeprecatedTable

      - id: DictionaryMark-System-OutputFile
        title: The tool shall write generated Markdown to a file when the output flag is provided.
        justification: |
          Writing to a file enables integration with documentation pipelines that
          consume generated Markdown files.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_WithOutputFile_WritesFile

      - id: DictionaryMark-System-GlobPatterns
        title: >-
          The tool shall accept glob patterns in the --input flag and process all
          YAML files matching those patterns.
        justification: |
          Glob pattern support allows users to specify wildcard input patterns rather
          than enumerating individual files, enabling flexible batch processing.
        tags: [system]
        children:
          - DictionaryMark-Utilities-FileMatching
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_GlobInput_ProcessesMatches

      - id: DictionaryMark-System-MultipleInputs
        title: >-
          The tool shall accept multiple --input flag values and merge the dictionary
          entries from all specified sources.
        justification: |
          Supporting multiple input files allows users to compose dictionaries from
          separate source files without manual pre-processing.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_MultipleInputs_MergesEntries

      - id: DictionaryMark-System-ConflictDetection-Report
        title: The tool shall report an error message when conflicting definitions are detected across input files.
        justification: |
          Conflicting definitions indicate data quality issues that must be resolved
          before publishing documentation. Users must be notified via an explicit error
          message so they can identify and resolve the conflict.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-ConflictDetection
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_ConflictingEntries_ReportsError

      - id: DictionaryMark-System-ConflictDetection-ExitCode
        title: The tool shall return a non-zero exit code when conflicting definitions are detected.
        justification: |
          A non-zero exit code enables CI/CD pipelines to automatically detect and
          surface definition conflicts, preventing incorrect documentation from being
          published silently.
        tags: [system]
        children:
          - DictionaryMark-Program-ExitCode
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_ConflictingEntries_ReportsError

      - id: DictionaryMark-System-SectionHeading
        title: The tool shall prefix generated Markdown output with a section heading when the section flag is provided.
        justification: |
          Section headings allow generated dictionaries to be embedded within larger
          documentation pages without requiring manual post-processing by the user.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
        tests:
          - DictionaryMark_Generate_WithSectionHeading_OutputsHeading

      - id: DictionaryMark-System-TermHeader
        title: >-
          The tool shall use the term-header flag value as the term column header
          in table format output.
        justification: |
          Customizable column headers allow users to adapt generated tables to domain
          vocabularies (e.g., "Word", "Abbreviation") without modifying the output file.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
        tests:
          - DictionaryMark_Generate_WithTermHeader_OutputsCustomHeader

      - id: DictionaryMark-System-DefHeader
        title: >-
          The tool shall use the def-header flag value as the definition column header
          in table format output.
        justification: |
          Customizable definition column headers allow users to tailor generated tables
          to their documentation context without post-processing the output.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
        tests:
          - DictionaryMark_Generate_WithDefHeader_OutputsCustomHeader

      - id: DictionaryMark-System-SortAlpha
        title: The tool shall output dictionary entries sorted alphabetically when the sort flag is set to alpha.
        justification: |
          Alphabetical ordering improves readability and enables users to locate entries
          quickly in large dictionaries, regardless of the order terms appear in the
          source YAML files.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
        tests:
          - DictionaryMark_Generate_WithSortAlpha_OutputsAlphabeticOrder

      - id: DictionaryMark-System-SortFileOrder
        title: >-
          The tool shall output dictionary entries in file-encounter order when the
          sort order is not set to alphabetical.
        justification: |
          Preserving file-encounter order gives users predictable output when
          the order of entries within source files is intentional.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
        tests:
          - DictionaryMark_Generate_DefaultSort_PreservesFileOrder

      - id: DictionaryMark-System-HeadingDepth
        title: >-
          The tool shall generate section headings at the specified Markdown heading
          level when the depth flag is provided.
        justification: |
          Configurable heading depth allows generated sections to be nested within
          existing document hierarchies without conflicting with surrounding headings.
        tags: [system]
        children:
          - DictionaryMark-Cli-ArgumentParsing
          - DictionaryMark-Dictionary-MarkdownFormatting
          - DictionaryMark-Cli-HeadingDepth
        tests:
          - DictionaryMark_Generate_SectionWithDepth_OutputsHeading

      - id: DictionaryMark-System-ValidateResults-TRX
        title: >-
          The tool shall write TRX-format validation test results when the results
          flag is provided with a .trx extension.
        justification: |
          TRX format is widely used in MSTest-compatible toolchains and CI pipelines,
          enabling structured test evidence consumption without parsing console output.
        tags: [system]
        children:
          - DictionaryMark-SelfTest-Subsystem
          - DictionaryMark-Cli-ResultsFile
        tests:
          - DictionaryMark_ValidateWithTrxResults_Requested_GeneratesTrxFile

      - id: DictionaryMark-System-ValidateResults-XML
        title: >-
          The tool shall write JUnit XML-format validation test results when the
          results flag is provided with a .xml extension.
        justification: |
          JUnit XML is the most widely supported test results interchange format,
          enabling integration with a broad range of CI/CD and reporting tools.
        tags: [system]
        children:
          - DictionaryMark-SelfTest-Subsystem
          - DictionaryMark-Cli-ResultsFile
        tests:
          - DictionaryMark_ValidateWithXmlResults_Requested_GeneratesJUnitFile

      - id: DictionaryMark-System-CrossPlatform
        title: >-
          The system shall run on supported operating systems and .NET runtime versions.
        justification: |
          Cross-platform support ensures the tool can be used in diverse development
          environments including Windows and Ubuntu, and across the supported .NET LTS and
          current releases. The CI matrix validates this on every build.
          This requirement is satisfied by its children: each child carries source-filtered
          test references from the CI matrix job, scoped to the specific platform or runtime
          it represents. Satisfaction of all children constitutes complete evidence for this
          system-level requirement.
        tags: [system]
        children:
          - DictionaryMark-Platform-Windows
          - DictionaryMark-Platform-Ubuntu
          - DictionaryMark-Platform-DotNet10
          - DictionaryMark-Platform-DotNet11

      - id: DictionaryMark-System-ColumnWidths
        title: >-
          The tool shall size table columns in proportion to the relative weights given by the column-widths option,
          dropping the third weight and rescaling the first two when a deprecated table has no Where column.
        justification: |
          Generated tables are often embedded in documents rendered to PDF, where column widths follow the
          separator dash counts. Long definitions need a wider column than short terms to stay readable, and
          users must be able to choose the ratio without editing generated files.
        tags: [system]
        children:
          - DictionaryMark-Cli-ColumnWidthsOption
          - DictionaryMark-Dictionary-ColumnWidths
        tests:
          - DictionaryMark_Generate_ColumnWidths_OutputsProportionalSeparator
          - DictionaryMark_Generate_ColumnWidthsDeprecatedWithoutWhere_RescalesTwoColumns
          - DictionaryMark_Generate_ColumnWidthsWithBullets_OutputUnchanged

      - id: DictionaryMark-System-ColumnWidths-Validation
        title: >-
          The tool shall reject column widths that are not positive integers, are empty, or whose count does not
          match the number of table columns, with an error and a non-zero exit code.
        justification: |
          A zero, negative or fractional weight, or the wrong number of weights, cannot describe the table and
          would silently produce a misleading layout; failing early tells the user what to fix.
        tags: [system]
        children:
          - DictionaryMark-Cli-ColumnWidthsOption
          - DictionaryMark-Cli-FormattingPrecedence
        tests:
          - DictionaryMark_Generate_ColumnWidthsInvalidValue_ReturnsError
          - DictionaryMark_Generate_ColumnWidthsWrongCount_ReturnsError

      - id: DictionaryMark-System-ConfigFile-Defaults
        title: >-
          The tool shall apply the formatting defaults given in a YAML configuration file named by the config
          option.
        justification: |
          Projects that generate several glossaries repeat the same formatting options; keeping them in one
          version-controlled file avoids long, duplicated command lines.
        tags: [system]
        children:
          - DictionaryMark-Cli-ConfigFile
          - DictionaryMark-Cli-FormattingPrecedence
        tests:
          - DictionaryMark_Config_FormattingDefaults_AppliedToCommandLineRun

      - id: DictionaryMark-System-ConfigFile-Precedence
        title: >-
          The tool shall take each formatting setting from the command line first, then from the table job, then
          from the configuration file defaults, and finally from the built-in default.
        justification: |
          A predictable precedence lets users override a shared configuration for a single run without editing
          the file, and lets each table job refine the shared defaults.
        tags: [system]
        children:
          - DictionaryMark-Cli-FormattingPrecedence
        tests:
          - DictionaryMark_Config_CommandLineOption_OverridesFileValues

      - id: DictionaryMark-System-ConfigFile-TableJobs
        title: >-
          The tool shall generate one output file for each table job listed under tables in the configuration
          file.
        justification: |
          Documentation sets need several tables (for example approved and deprecated terms) generated in one
          step, each from its own inputs and with its own formatting.
        tags: [system]
        children:
          - DictionaryMark-Cli-ConfigFile
          - DictionaryMark-Dictionary-TableJobs
          - DictionaryMark-Program-GenerateDictionary
        tests:
          - DictionaryMark_Config_MultipleTableJobs_WritesEachOutput

      - id: DictionaryMark-System-ConfigFile-RelativePaths
        title: >-
          The tool shall resolve relative input patterns and output paths of table jobs against the configuration
          file's directory, including parent-directory segments, when no root directory is specified.
        justification: |
          A configuration file must work the same from any working directory, and dictionaries are often shared
          from a directory outside the one that holds the configuration file.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-TableJobs
          - DictionaryMark-Utilities-PathResolution
        tests:
          - DictionaryMark_Config_RelativePathsWithParentSegments_ResolvedFromConfigDirectory

      - id: DictionaryMark-System-ConfigFile-EnvironmentVariables
        title: >-
          The tool shall expand ${VAR} environment-variable references in the configuration file path and in the
          input patterns and output paths of table jobs.
        justification: |
          Environment variables let the same configuration file locate shared dictionaries and output folders
          that differ between machines and CI agents.
        tags: [system]
        children:
          - DictionaryMark-Utilities-PathResolution
          - DictionaryMark-Cli-ConfigFile
        tests:
          - DictionaryMark_Config_EnvironmentVariablesInPaths_AreExpanded

      - id: DictionaryMark-System-ConfigFile-JobFailures
        title: >-
          The tool shall process every table job even when an earlier job fails, report each failure naming the
          job index and output, and return a non-zero exit code when any job failed.
        justification: |
          Reporting every failing job in one run saves repeated fix-and-retry cycles, and a non-zero exit code
          lets CI pipelines detect any failure.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-TableJobs
          - DictionaryMark-Program-ExitCode
        tests:
          - DictionaryMark_Config_OneJobFails_OtherJobsWrittenAndExitNonZero

      - id: DictionaryMark-System-ConfigFile-Validation
        title: >-
          The tool shall reject a configuration file that is missing, unreadable, not valid YAML, wrongly
          structured, or contains an unknown, disallowed or invalid key, with an error naming the file and the key
          or job.
        justification: |
          Silently ignoring a misspelled or misplaced key would generate wrong output; a precise error lets the
          user correct the file quickly.
        tags: [system]
        children:
          - DictionaryMark-Cli-ConfigFile
        tests:
          - DictionaryMark_Config_InvalidFile_ReturnsErrorNamingFile
          - DictionaryMark_Config_UnknownKey_ReturnsErrorNamingKey

      - id: DictionaryMark-System-ConfigFile-CommandLineConflict
        title: >-
          The tool shall reject the input and output options when the configuration file defines table jobs, and
          shall reject a repeated config option.
        justification: |
          When the file defines the jobs, command-line inputs and outputs would be ambiguous; rejecting them
          avoids generating files the user did not intend.
        tags: [system]
        children:
          - DictionaryMark-Cli-ConfigFile
        tests:
          - DictionaryMark_Config_TablesWithCommandLineInput_ReturnsError

      - id: DictionaryMark-System-ParentDirectoryPatterns
        title: >-
          The tool shall accept parent-directory segments anywhere before the first wildcard in command-line input
          patterns.
        justification: |
          Users commonly reference shared dictionaries in sibling directories with relative paths such as
          ../shared/*.yaml.
        tags: [system]
        children:
          - DictionaryMark-Utilities-PathResolution
          - DictionaryMark-Utilities-FileMatching
        tests:
          - DictionaryMark_Generate_ParentDirectoryGlob_ProcessesMatches

      - id: DictionaryMark-System-OutputDirectoryCreation
        title: The tool shall create missing parent directories of output files.
        justification: |
          Generated documentation is usually written into build folders that do not yet exist in a clean
          checkout; requiring users to create them first adds needless pipeline steps.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-Generation
        tests:
          - DictionaryMark_Generate_OutputInMissingDirectory_CreatesDirectory

      - id: DictionaryMark-System-RootDirectory
        title: >-
          The tool shall resolve every relative input pattern and output path, from the command line or the
          configuration file, against the directory given by the root option, where a relative root resolves
          against the working directory, ${VAR} references and parent-directory segments are supported, and
          absolute paths are unchanged.
        justification: |
          A root directory lets users run the tool from any working directory (for example a CI step or an IDE
          task) while writing paths relative to the repository.
        tags: [system]
        children:
          - DictionaryMark-Cli-RootDirectory
          - DictionaryMark-Utilities-PathResolution
          - DictionaryMark-Dictionary-TableJobs
        tests:
          - DictionaryMark_Root_CommandLineInputsAndOutput_ResolvedAgainstRoot
          - DictionaryMark_Root_RelativeRootWithParentSegments_ResolvedAgainstWorkingDirectory
          - DictionaryMark_Root_ConfigTables_ResolvedAgainstRoot
          - DictionaryMark_Root_EnvironmentVariable_Expanded
          - DictionaryMark_Root_AbsoluteInputAndOutput_IgnoreRoot

      - id: DictionaryMark-System-ConfigFile-Root
        title: >-
          The tool shall use the configuration file's top-level root key as the base directory for every relative
          input pattern and output path, resolving the key relative to the configuration file's directory with
          ${VAR} references and parent-directory segments.
        justification: |
          A configuration file kept in a tools folder can then use repository-relative paths, independent of
          where the file itself is stored.
        tags: [system]
        children:
          - DictionaryMark-Cli-RootDirectory
          - DictionaryMark-Cli-ConfigFile
        tests:
          - DictionaryMark_Config_Root_TablesResolvedAgainstRoot
          - DictionaryMark_Config_Root_CommandLineInputsResolvedAgainstRoot

      - id: DictionaryMark-System-RootDirectory-Precedence
        title: >-
          The tool shall take the base directory for relative paths from the root option first, then from the
          configuration file's root key, and otherwise use the configuration file's directory for paths from the
          file and the working directory for command-line paths.
        justification: |
          A predictable precedence lets a single run override the configured root without editing the file,
          while keeping the original behavior when no root is given.
        tags: [system]
        children:
          - DictionaryMark-Cli-RootDirectory
        tests:
          - DictionaryMark_Root_CommandLineRoot_OverridesConfigRoot
          - DictionaryMark_Config_RelativePathsWithParentSegments_ResolvedFromConfigDirectory
          - DictionaryMark_Config_NoRoot_CommandLinePathsUseWorkingDirectory

      - id: DictionaryMark-System-RootDirectory-Validation
        title: >-
          The tool shall reject a root directory that does not exist (from either source), a repeated or empty
          root option, and a root key inside a table job, with an error and a non-zero exit code.
        justification: |
          Resolving paths against a missing or ambiguous root would fail later with confusing per-file errors;
          rejecting it up front names the actual problem.
        tags: [system]
        children:
          - DictionaryMark-Cli-RootDirectory
          - DictionaryMark-Cli-ConfigFile
        tests:
          - DictionaryMark_Root_MissingDirectory_ReturnsError
          - DictionaryMark_Root_SpecifiedTwice_ReturnsError
          - DictionaryMark_Config_MissingRoot_ReturnsErrorNamingFile
          - DictionaryMark_Config_RootInTableJob_ReturnsErrorNamingJob

      - id: DictionaryMark-System-FileAccess-Modes
        title: >-
          The tool shall judge the inputs and outputs of configuration-file tables by a file-access mode chosen with
          the file-access option - any (the default, every regular local file), roots (only inside the allowed
          folders), no-symlinks (no symbolic link or junction), or roots,no-symlinks (both) - and shall reject any
          other value with an error and a non-zero exit code before any input is read.
        justification: |
          A configuration file may come from an untrusted source (a pull request, a shared repository); the person
          running the tool must be able to choose how far its table inputs and outputs may reach, and a mistake in
          that choice must never silently weaken it.
        tags: [system]
        children:
          - DictionaryMark-Cli-FileAccessOptions
          - DictionaryMark-Files-AccessPolicy
        tests:
          - DictionaryMark_FileAccess_AllowRootAsProcess_ConfinesConfigJobs
          - DictionaryMark_FileAccess_NoSymlinksAsProcess_DeniesLinkedConfigInput
          - DictionaryMark_FileAccess_MistakesAsProcess_AreUsageErrors

      - id: DictionaryMark-System-FileAccess-AllowRoot
        title: >-
          The tool shall accept a repeatable allow-root option naming a folder that configuration-file table
          inputs and outputs may be in (a relative folder taken from the working directory), which implies the
          roots mode and replaces the default folders, and shall reject it with an error and a non-zero exit code
          when combined with the any or no-symlinks mode or when the folder does not exist.
        justification: |
          Users confine a run to the folders they trust; a folder that does not exist or a contradictory
          combination of options is a mistake that must be reported rather than guessed at.
        tags: [system]
        children:
          - DictionaryMark-Cli-FileAccessOptions
          - DictionaryMark-Files-AccessPolicy
        tests:
          - DictionaryMark_FileAccess_AllowRootAsProcess_ConfinesConfigJobs
          - DictionaryMark_FileAccess_MistakesAsProcess_AreUsageErrors

      - id: DictionaryMark-System-FileAccess-DefaultRoots
        title: >-
          The tool shall, in the roots mode without an allow-root option, allow configuration-file table inputs
          and outputs inside the working directory and inside the folder of the configuration file.
        justification: |
          The common case - a configuration file in the repository being built - must work with the roots mode
          alone, without naming every folder.
        tags: [system]
        children:
          - DictionaryMark-Cli-FileAccessOptions
        tests:
          - DictionaryMark_FileAccess_RootsWithoutAllowRoot_AllowsWorkingAndConfigFolders

      - id: DictionaryMark-System-FileAccess-ConfigPathsJudged
        title: >-
          The tool shall judge every input file of a configuration-file table - each literal input and every
          match of a glob pattern - by the file that was actually opened (its real path), shall parse exactly
          the bytes that were judged, and shall read at most 16 MiB of each such file.
        justification: |
          A glob or a link can lead a table to a file the user never intended to expose; judging the opened file,
          not its name, keeps a link swapped in by another process from slipping past the check, and the size
          limit bounds the work an untrusted configuration file can cause.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-FileAccess
          - DictionaryMark-Files-ReferenceResolution
          - DictionaryMark-Files-RaceFreeCheck
          - DictionaryMark-Files-BoundedReading
        tests:
          - DictionaryMark_FileAccess_AllowRootAsProcess_ConfinesConfigJobs
          - DictionaryMark_FileAccess_GlobMatchOutsideRoots_IsDeniedNotSkipped
          - DictionaryMark_FileAccess_NoSymlinksAsProcess_DeniesLinkedConfigInput

      - id: DictionaryMark-System-FileAccess-Outputs
        title: >-
          The tool shall judge the output file of every configuration-file table by the same file-access mode
          before anything is created, so a refused output writes neither the file nor any folder.
        justification: |
          A configuration file that can choose where to write could overwrite files outside the folders the user
          trusts; the check must come before the tool creates missing folders.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-FileAccess
          - DictionaryMark-Files-OutputPaths
        tests:
          - DictionaryMark_FileAccess_AllowRootAsProcess_ConfinesConfigJobs
          - DictionaryMark_FileAccess_DeniedJob_OtherJobsRunAndExitCodeIsOne

      - id: DictionaryMark-System-FileAccess-NeverList
        title: >-
          The tool shall refuse, in every file-access mode including the default, a configuration-file table input
          or output that names a network location, a device (also a reserved device name on Windows), an alternate
          data stream or a colon outside a Windows drive, a control character, or something other than a regular
          file, and shall refuse a configuration-file table input pattern that breaks one of these text rules before
          any of its folders is listed.
        justification: |
          Network paths can leak credentials and devices can hang or flood the tool; no configuration file needs
          them, so they are refused even when every local file is allowed.
        tags: [system]
        children:
          - DictionaryMark-Files-AlwaysRefused
          - DictionaryMark-Files-OutputPaths
          - DictionaryMark-Files-PatternText
        tests:
          - DictionaryMark_FileAccess_DefaultMode_NeverListRefusesConfigPaths
          - DictionaryMark_FileAccess_NetworkInputPattern_RefusedBeforeListing

      - id: DictionaryMark-System-FileAccess-Denial
        title: >-
          The tool shall report a configuration-file table whose input or output the file-access mode refuses as a
          file-access-denied error of that table, shall still run the other tables, and shall exit with a non-zero
          exit code.
        justification: |
          One refused table must not hide the results of the others, and the user must be able to tell a policy
          refusal from an ordinary read or write failure.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-FileAccess
          - DictionaryMark-Files-ReferenceFailureReporting
        tests:
          - DictionaryMark_FileAccess_DeniedJob_OtherJobsRunAndExitCodeIsOne

      - id: DictionaryMark-System-FileAccess-CommandLineTrusted
        title: >-
          The tool shall never judge the paths named on the command line (the config, input, output, log and
          results options) by the file-access mode, and shall never let the configuration file's root key widen
          the allowed folders.
        justification: |
          The person running the tool chose the command-line paths on purpose; only what an untrusted
          configuration file names needs to be judged, and that file must not be able to move its own boundary.
        tags: [system]
        children:
          - DictionaryMark-Dictionary-FileAccess
        tests:
          - DictionaryMark_FileAccess_CommandLinePaths_AreNotJudged
          - DictionaryMark_FileAccess_ConfigRootKey_DoesNotWidenAllowedFolders
